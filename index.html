,[6,"And there are diversities of workings, but the same God, who worketh all things in all."],[7,"But to each one is given the manifestation of the Spirit to profit withal."],[8,"For to one is given through the Spirit the word of wisdom; and to another the word of knowledge, according to the same Spirit:"],[9,"to another faith, in the same Spirit; and to another gifts of healings, in the one Spirit;"],[10,"and to another workings of miracles; and to another prophecy; and to another discernings of spirits: to another divers kinds of tongues; and to another the interpretation of tongues:"],[11,"but all these worketh the one and the same Spirit, dividing to each one severally even as he will."]],"x-ephesians5-18":[[18,"And be not drunken with wine, wherein is riot, but be filled with the Spirit;"],[19,"speaking one to another in psalms and hymns and spiritual songs, singing and making melody with your heart to the Lord;"],[20,"giving thanks always for all things in the name of our Lord Jesus Christ to God, even the Father;"],[21,"subjecting yourselves one to another in the fear of Christ."]],"x-romans8-26":[[26,"And in like manner the Spirit also helpeth our infirmity: for we know not how to pray as we ought; but the Spirit himself maketh intercession for us with groanings which cannot be uttered;"],[27,"and he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God."]],"x-hebrews11-1":[[1,"Now faith is assurance of things hoped for, a conviction of things not seen."],[2,"For therein the elders had witness borne to them."],[3,"By faith we understand that the worlds have been framed by the word of God, so that what is seen hath not been made out of things which appear."],[4,"By faith Abel offered unto God a more excellent sacrifice than Cain, through which he had witness borne to him that he was righteous, God bearing witness in respect of his gifts: and through it he being dead yet speaketh."],[5,"By faith Enoch was translated that he should not see death; and he was not found, because God translated him: for he hath had witness borne to him that before his translation he had been well-pleasing unto God:"],[6,"and without faith it is impossible to be well-pleasing unto him; for he that cometh to God must believe that he is, and that he is a rewarder of them that seek after him."]],"x-romans1-17":[[17,"For therein is revealed a righteousness of God from faith unto faith: as it is written, But the righteous shall live by faith."]],"x-2corinthians5-7":[[7,"(for we walk by faith, not by sight);"]],"x-psalm37-3":[[3,"Trust in Jehovah, and do good; Dwell in the land, and feed on his faithfulness."],[4,"Delight thyself also in Jehovah; And he will give thee the desires of thy heart."],[5,"Commit thy way unto Jehovah; Trust also in him, and he will bring it to pass."],[6,"And he will make thy righteousness to go forth as the light, And thy justice as the noonday."],[7,"Rest in Jehovah, and wait patiently for him: Fret not thyself because of him who prospereth in his way, Because of the man who bringeth wicked devices to pass."]],"x-philippians4-19":[[19,"And my God shall supply every need of yours according to his riches in glory in Christ Jesus."]],"x-matthew6-25":[[25,"Therefore I say unto you, Be not anxious for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than the food, and the body than the raiment?"],[26,"Behold the birds of the heaven, that they sow not, neither do they reap, nor gather into barns; and your heavenly Father feedeth them. Are not ye of much more value than they?"],[27,"And which of you by being anxious can add one cubit unto the measure of his life?"],[28,"And why are ye anxious concerning raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:"],[29,"yet I say unto you, that even Solomon in all his glory was not arrayed like one of these."],[30,"But if God doth so clothe the grass of the field, which to-day is, and to-morrow is cast into the oven, shall he not much more clothe you, O ye of little faith?"],[31,"Be not therefore anxious, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?"],[32,"For after all these things do the Gentiles seek; for your heavenly Father knoweth that ye have need of all these things."]],"x-matthew6-34":[[34,"Be not therefore anxious for the morrow: for the morrow will be anxious for itself. Sufficient unto the day is the evil thereof."]],"x-matthew14-14":[[14,"And he came forth, and saw a great multitude, and he had compassion on them, and healed their sick."]],"x-matthew8-16":[[16,"And when even was come, they brought unto him many possessed with demons: and he cast out the spirits with a word, and healed all that were sick:"],[17,"that it might be fulfilled which was spoken through Isaiah the prophet, saying, Himself took our infirmities, and bare our diseases."]],"x-1timothy6-6":[[6,"But godliness with contentment is great gain:"],[7,"for we brought nothing into the world, for neither can we carry anything out;"],[8,"but having food and covering we shall be therewith content."],[9,"But they that are minded to be rich fall into a temptation and a snare and many foolish and hurtful lusts, such as drown men in destruction and perdition."],[10,"For the love of money is a root of all kinds of evil: which some reaching after have been led astray from the faith, and have pierced themselves through with many sorrows."]],"x-philippians4-11":[[11,"Not that I speak in respect of want: for I have learned, in whatsoever state I am, therein to be content."],[12,"I know how to be abased, and I know also how to abound: in everything and in all things have I learned the secret both to be filled and to be hungry, both to abound and to be in want."]],"x-james1-2":[[2,"Count it all joy, my brethren, when ye fall into manifold temptations;"],[3,"knowing that the proving of your faith worketh patience."],[4,"And let patience have its perfect work, that ye may be perfect and entire, lacking in nothing."]],"x-romans5-3":[[3,"And not only so, but we also rejoice in our tribulations: knowing that tribulation worketh stedfastness;"],[4,"and stedfastness, approvedness; and approvedness, hope:"],[5,"and hope putteth not to shame; because the love of God hath been shed abroad in our hearts through the Holy Spirit which was given unto us."]],"x-romans5-1":[[1,"Being therefore justified by faith, we have peace with God through our Lord Jesus Christ;"]],"x-2corinthians5-21":[[21,"Him who knew no sin he made to be sin on our behalf; that we might become the righteousness of God in him."]],"x-romans6-6":[[6,"knowing this, that our old man was crucified with him, that the body of sin might be done away, that so we should no longer be in bondage to sin;"],[7,"for he that hath died is justified from sin."],[8,"But if we died with Christ, we believe that we shall also live with him;"]],"x-romans6-10":[[10,"For the death that he died, he died unto sin once: but the life that he liveth, he liveth unto God."],[11,"Even so reckon ye also yourselves to be dead unto sin, but alive unto God in Christ Jesus."],[12,"Let not sin therefore reign in your mortal body, that ye should obey the lusts thereof:"],[13,"neither present your members unto sin as instruments of unrighteousness; but present yourselves unto God, as alive from the dead, and your members as instruments of righteousness unto God."],[14,"For sin shall not have dominion over you: for ye are not under law, but under grace."]],"x-james1-12":[[12,"Blessed is the man that endureth temptation; for when he hath been approved, he shall receive the crown of life, which the Lord promised to them that love him."],[13,"Let no man say when he is tempted, I am tempted of God; for God cannot be tempted with evil, and he himself tempteth no man:"],[14,"but each man is tempted, when he is drawn away by his own lust, and enticed."],[15,"Then the lust, when it hath conceived, beareth sin: and the sin, when it is fullgrown, bringeth forth death."]],"x-ephesians4-31":[[31,"Let all bitterness, and wrath, and anger, and clamor, and railing, be put away from you, with all malice:"],[32,"and be ye kind one to another, tenderhearted, forgiving each other, even as God also in Christ forgave you."]],"x-colossians3-12":[[12,"Put on therefore, as God’s elect, holy and beloved, a heart of compassion, kindness, lowliness, meekness, longsuffering;"],[13,"forbearing one another, and forgiving each other, if any man have a complaint against any; even as the Lord forgave you, so also do ye:"],[14,"and above all these things put on love, which is the bond of perfectness."]],"x-2peter1-5":[[5,"Yea, and for this very cause adding on your part all diligence, in your faith supply virtue; and in your virtue knowledge;"],[6,"and in your knowledge self-control; and in your self-control patience; and in your patience godliness;"],[7,"and in your godliness brotherly kindness; and in your brotherly kindness love."],[8,"For if these things are yours and abound, they make you to be not idle nor unfruitful unto the knowledge of our Lord Jesus Christ."]],"x-philippians2-12":[[12,"So then, my beloved, even as ye have always obeyed, not as in my presence only, but now much more in my absence, work out your own salvation with fear and trembling;"],[13,"for it is God who worketh in you both to will and to work, for his good pleasure."]],"x-1corinthians12-12":[[12,"For as the body is one, and hath many members, and all the members of the body, being many, are one body; so also is Christ."],[13,"For in one Spirit were we all baptized into one body, whether Jews or Greeks, whether bond or free; and were all made to drink of one Spirit."],[14,"For the body is not one member, but many."],[15,"If the foot shall say, Because I am not the hand, I am not of the body; it is not therefore not of the body."],[16,"And if the ear shall say, Because I am not the eye, I am not of the body; it is not therefore not of the body."],[17,"If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling?"],[18,"But now hath God set the members each one of them in the body, even as it pleased him."],[19,"And if they were all one member, where were the body?"],[20,"But now they are many members, but one body."],[21,"And the eye cannot say to the hand, I have no need of thee: or again the head to the feet, I have no need of you."],[22,"Nay, much rather, those members of the body which seem to be more feeble are necessary:"],[23,"and those parts of the body, which we think to be less honorable, upon these we bestow more abundant honor; and our uncomely parts have more abundant comeliness;"],[24,"whereas our comely parts have no need: but God tempered the body together, giving more abundant honor to that part which lacked;"],[25,"that there should be no schism in the body; but that the members should have the same care one for another."],[26,"And whether one member suffereth, all the members suffer with it; or one member is honored, all the members rejoice with it."],[27,"Now ye are the body of Christ, and severally members thereof."]],"x-acts2-42":[[42,"And they continued stedfastly in the apostles’ teaching and fellowship, in the breaking of bread and the prayers."],[43,"And fear came upon every soul: and many wonders and signs were done through the apostles."],[44,"And all that believed were together, and had all things common;"],[45,"and they sold their possessions and goods, and parted them to all, according as any man had need."],[46,"And day by day, continuing stedfastly with one accord in the temple, and breaking bread at home, they took their food with gladness and singleness of heart,"],[47,"praising God, and having favor with all the people. And the Lord added to them day by day those that were saved."]],"x-john13-34":[[34,"A new commandment I give unto you, that ye love one another; even as I have loved you, that ye also love one another."],[35,"By this shall all men know that ye are my disciples, if ye have love one to another."]],"x-galatians5-13":[[13,"For ye, brethren, were called for freedom; only use not your freedom for an occasion to the flesh, but through love be servants one to another."]],"x-1peter4-10":[[10,"according as each hath received a gift, ministering it among yourselves, as good stewards of the manifold grace of God;"]],"x-ephesians4-1":[[1,"I therefore, the prisoner in the Lord, beseech you to walk worthily of the calling wherewith ye were called,"],[2,"with all lowliness and meekness, with longsuffering, forbearing one another in love;"],[3,"giving diligence to keep the unity of the Spirit in the bond of peace."],[4,"There is one body, and one Spirit, even as also ye were called in one hope of your calling;"],[5,"one Lord, one faith, one baptism,"],[6,"one God and Father of all, who is over all, and through all, and in all."]],"x-colossians3-15":[[15,"And let the peace of Christ rule in your hearts, to the which also ye were called in one body; and be ye thankful."]],"x-matthew18-15":[[15,"And if thy brother sin against thee, go, show him his fault between thee and him alone: if he hear thee, thou hast gained thy brother."],[16,"But if he hear thee not, take with thee one or two more, that at the mouth of two witnesses or three every word may be established."],[17,"And if he refuse to hear them, tell it unto the church: and if he refuse to hear the church also, let him be unto thee as the Gentile and the publican."]],"x-ephesians4-11":[[11,"And he gave some to be apostles; and some, prophets; and some, evangelists; and some, pastors and teachers;"],[12,"for the perfecting of the saints, unto the work of ministering, unto the building up of the body of Christ:"],[13,"till we all attain unto the unity of the faith, and of the knowledge of the Son of God, unto a fullgrown man, unto the measure of the stature of the fulness of Christ:"],[14,"that we may be no longer children, tossed to and fro and carried about with every wind of doctrine, by the sleight of men, in craftiness, after the wiles of error;"],[15,"but speaking truth in love, may grow up in all things into him, who is the head, even Christ;"],[16,"from whom all the body fitly framed and knit together through that which every joint supplieth, according to the working in due measure of each several part, maketh the increase of the body unto the building up of itself in love."]],"x-james4-7":[[7,"Be subject therefore unto God; but resist the devil, and he will flee from you."],[8,"Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye doubleminded."]],"x-1peter5-8":[[8,"Be sober, be watchful: your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:"],[9,"whom withstand stedfast in your faith, knowing that the same sufferings are accomplished in your brethren who are in the world."]],"x-colossians2-13":[[13,"And you, being dead through your trespasses and the uncircumcision of your flesh, you, I say, did he make alive together with him, having forgiven us all our trespasses;"],[14,"having blotted out the bond written in ordinances that was against us, which was contrary to us: and he hath taken it out of the way, nailing it to the cross;"],[15,"having despoiled the principalities and the powers, he made a show of them openly, triumphing over them in it."]],"x-luke10-17":[[17,"And the seventy returned with joy, saying, Lord, even the demons are subject unto us in thy name."],[18,"And he said unto them, I beheld Satan fallen as lightning from heaven."],[19,"Behold, I have given you authority to tread upon serpents and scorpions, and over all the power of the enemy: and nothing shall in any wise hurt you."],[20,"Nevertheless in this rejoice not, that the spirits are subject unto you; but rejoice that your names are written in heaven."]],"x-romans8-37":[[37,"Nay, in all these things we are more than conquerors through him that loved us."]],"x-1john5-4":[[4,"For whatsoever is begotten of God overcometh the world: and this is the victory that hath overcome the world, even our faith."],[5,"And who is he that overcometh the world, but he that believeth that Jesus is the Son of God?"]],"x-2corinthians10-3":[[3,"For though we walk in the flesh, we do not war according to the flesh"],[4,"(for the weapons of our warfare are not of the flesh, but mighty before God to the casting down of strongholds);"],[5,"casting down imaginations, and every high thing that is exalted against the knowledge of God, and bringing every thought into captivity to the obedience of Christ;"]],"x-1john4-1":[[1,"Beloved, believe not every spirit, but prove the spirits, whether they are of God; because many false prophets are gone out into the world."],[2,"Hereby know ye the Spirit of God: every spirit that confesseth that Jesus Christ is come in the flesh is of God:"],[3,"and every spirit that confesseth not Jesus is not of God: and this is the spirit of the antichrist, whereof ye have heard that it cometh; and now it is in the world already."],[4,"Ye are of God, my little children, and have overcome them: because greater is he that is in you than he that is in the world."]],"x-matthew5-13":[[13,"Ye are the salt of the earth: but if the salt have lost its savor, wherewith shall it be salted? it is thenceforth good for nothing, but to be cast out and trodden under foot of men."],[14,"Ye are the light of the world. A city set on a hill cannot be hid."],[15,"Neither do men light a lamp, and put it under the bushel, but on the stand; and it shineth unto all that are in the house."]],"x-1corinthians13-1":[[1,"If I speak with the tongues of men and of angels, but have not love, I am become sounding brass, or a clanging cymbal."],[2,"And if I have the gift of prophecy, and know all mysteries and all knowledge; and if I have all faith, so as to remove mountains, but have not love, I am nothing."],[3,"And if I bestow all my goods to feed the poor, and if I give my body to be burned, but have not love, it profiteth me nothing."],[4,"Love suffereth long, and is kind; love envieth not; love vaunteth not itself, is not puffed up,"],[5,"doth not behave itself unseemly, seeketh not its own, is not provoked, taketh not account of evil;"],[6,"rejoiceth not in unrighteousness, but rejoiceth with the truth;"],[7,"beareth all things, believeth all things, hopeth all things, endureth all things."]],"x-proverbs10-9":[[9,"He that walketh uprightly walketh surely; But he that perverteth his ways shall be known."]],"x-titus2-7":[[7,"in all things showing thyself an ensample of good works; in thy doctrine showing uncorruptness, gravity,"],[8,"sound speech, that cannot be condemned; that he that is of the contrary part may be ashamed, having no evil thing to say of us."]],"x-colossians3-23":[[23,"whatsoever ye do, work heartily, as unto the Lord, and not unto men;"],[24,"knowing that from the Lord ye shall receive the recompense of the inheritance: ye serve the Lord Christ."]],"x-luke16-10":[[10,"He that is faithful in a very little is faithful also in much: and he that is unrighteous in a very little is unrighteous also in much."],[11,"If therefore ye have not been faithful in the unrighteous mammon, who will commit to your trust the true riches?"],[12,"And if ye have not been faithful in that which is another’s, who will give you that which is your own?"]],"x-2corinthians9-6":[[6,"But this I say, He that soweth sparingly shall reap also sparingly; and he that soweth bountifully shall reap also bountifully."],[7,"Let each man do according as he hath purposed in his heart: not grudgingly, or of necessity: for God loveth a cheerful giver."],[8,"And God is able to make all grace abound unto you; that ye, having always all sufficiency in everything, may abound unto every good work:"]],"x-ephesians4-29":[[29,"Let no corrupt speech proceed out of your mouth, but such as is good for edifying as the need may be, that it may give grace to them that hear."]],"x-james1-19":[[19,"Ye know this, my beloved brethren. But let every man be swift to hear, slow to speak, slow to wrath:"]],"x-romans12-17":[[17,"Render to no man evil for evil. Take thought for things honorable in the sight of all men."],[18,"If it be possible, as much as in you lieth, be at peace with all men."],[19,"Avenge not yourselves, beloved, but give place unto the wrath of God: for it is written, Vengeance belongeth unto me; I will recompense, saith the Lord."],[20,"But if thine enemy hunger, feed him; if he thirst, give him to drink: for in so doing thou shalt heap coals of fire upon his head."],[21,"Be not overcome of evil, but overcome evil with good."]],"x-philippians1-9":[[9,"And this I pray, that your love may abound yet more and more in knowledge and all discernment;"],[10,"so that ye may approve the things that are excellent; that ye may be sincere and void of offence unto the day of Christ;"],[11,"being filled with the fruits of righteousness, which are through Jesus Christ, unto the glory and praise of God."]],"x-matthew28-18":[[18,"And Jesus came to them and spake unto them, saying, All authority hath been given unto me in heaven and on earth."]],"x-1peter3-16":[[16,"having a good conscience; that, wherein ye are spoken against, they may be put to shame who revile your good manner of life in Christ."]],"x-2timothy2-1":[[1,"Thou therefore, my child, be strengthened in the grace that is in Christ Jesus."],[2,"And the things which thou hast heard from me among many witnesses, the same commit thou to faithful men, who shall be able to teach others also."]],"x-hebrews12-1":[[1,"Therefore let us also, seeing we are compassed about with so great a cloud of witnesses, lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,"],[2,"looking unto Jesus the author and perfecter of our faith, who for the joy that was set before him endured the cross, despising shame, and hath sat down at the right hand of the throne of God."],[3,"For consider him that hath endured such gainsaying of sinners against himself, that ye wax not weary, fainting in your souls."]],"x-1thessalonians4-16":[[16,"For the Lord himself shall descend from heaven, with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first;"],[17,"then we that are alive, that are left, shall together with them be caught up in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord."],[18,"Wherefore comfort one another with these words."]],"x-1corinthians15-51":[[51,"Behold, I tell you a mystery: We all shall not sleep, but we shall all be changed,"],[52,"in a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible, and we shall be changed."],[53,"For this corruptible must put on incorruption, and this mortal must put on immortality."],[54,"But when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall come to pass the saying that is written, Death is swallowed up in victory."],[55,"O death, where is thy victory? O death, where is thy sting?"],[56,"The sting of death is sin; and the power of sin is the law:"],[57,"but thanks be to God, who giveth us the victory through our Lord Jesus Christ."]],"x-revelation21-1":[[1,"And I saw a new heaven and a new earth: for the first heaven and the first earth are passed away; and the sea is no more."],[2,"And I saw the holy city, new Jerusalem, coming down out of heaven from God, made ready as a bride adorned for her husband."],[3,"And I heard a great voice out of the throne saying, Behold, the tabernacle of God is with men, and he shall dwell with them, and they shall be his peoples, and God himself shall be with them, and be their God:"],[4,"and he shall wipe away every tear from their eyes; and death shall be no more; neither shall there be mourning, nor crying, nor pain, any more: the first things are passed away."],[5,"And he that sitteth on the throne said, Behold, I make all things new. And he saith, Write: for these words are faithful and true."]],"x-colossians3-1":[[1,"If then ye were raised together with Christ, seek the things that are above, where Christ is, seated on the right hand of God."],[2,"Set your mind on the things that are above, not on the things that are upon the earth."],[3,"For ye died, and your life is hid with Christ in God."],[4,"When Christ, who is our life, shall be manifested, then shall ye also with him be manifested in glory."]]},"BBE":{"x-john3-17":[[17,"God did not send his Son into the world to be judge of the world; he sent him so that the world might have salvation through him."],[18,"The man who has faith in him does not come up to be judged; but he who has no faith in him has been judged even now, because he has no faith in the name of the only Son of God."]],"x-1corinthians15-3":[[3,"For I gave to you first of all what was handed down to me, how Christ underwent death for our sins, as it says in the Writings;"],[4,"And he was put in the place of the dead; and on the third day he came back from the dead, as it says in the Writings;"]],"x-1peter2-24":[[24,"He took our sins on himself, giving his body to be nailed on the tree, so that we, being dead to sin, might have a new life in righteousness, and by his wounds we have been made well."]],"x-titus3-5":[[5,"Not by works of righteousness which we did ourselves, but in the measure of his mercy, he gave us salvation, through the washing of the new birth and the giving of new life in the Holy Spirit,"],[6,"Which he gave us freely through Jesus Christ our Saviour;"],[7,"So that, having been given righteousness through grace, we might have a part in the heritage, the hope of eternal life."]],"x-mark1-15":[[15,"And saying, The time has come, and the kingdom of God is near: let your hearts be turned from sin and have faith in the good news."]],"x-acts3-19":[[19,"So then, let your hearts be changed and be turned to God, so that your sins may be completely taken away, and times of blessing may come from the Lord;"]],"x-romans10-11":[[11,"Because it is said in the holy Writings, Whoever has faith in him will not be shamed."],[12,"And the Jew is not different from the Greek: for there is the same Lord of all, who is good to all who have hope in his name:"],[13,"Because, Whoever will give worship to the name of the Lord will get salvation."]],"x-john5-24":[[24,"Truly I say to you, The man whose ears are open to my word and who has faith in him who sent me, has eternal life; he will not be judged, but has come from death into life."]],"x-john1-1":[[1,"From the first he was the Word, and the Word was in relation with God and was God."],[2,"This Word was from the first in relation with God."],[3,"All things came into existence through him, and without him nothing was."]],"x-john1-14":[[14,"And so the Word became flesh and took a place among us for a time; and we saw his glory--such glory as is given to an only son by his father--saw it to be true and full of grace."]],"x-philippians2-5":[[5,"Let this mind be in you which was in Christ Jesus,"],[6,"To whom, though himself in the form of God, it did not seem that to take for oneself was to be like God;"],[7,"But he made himself as nothing, taking the form of a servant, being made like men;"],[8,"And being seen in form as a man, he took the lowest place, and let himself be put to death, even the death of the cross."]],"x-colossians2-9":[[9,"For in him all the wealth of God's being has a living form,"]],"x-hebrews1-1":[[1,"In times past the word of God came to our fathers through the prophets, in different parts and in different ways;"],[2,"But now, at the end of these days, it has come to us through his Son, to whom he has given all things for a heritage, and through whom he made the order of the generations;"],[3,"Who, being the outshining of his glory, the true image of his substance, supporting all things by the word of his power, having given himself as an offering making clean from sins, took his seat at the right hand of God in heaven;"]],"x-hebrews2-14":[[14,"And because the children are flesh and blood, he took a body himself and became like them; so that by his death he might put an end to him who had the power of death, that is to say, the Evil One;"],[15,"And let those who all their lives were in chains because of their fear of death, go free."],[16,"For, truly, he does not take on the life of angels, but that of the seed of Abraham."],[17,"Because of this it was necessary for him to be made like his brothers in every way, so that he might be a high priest full of mercy and keeping faith in everything to do with God, making offerings for the sins of the people."],[18,"For having been put to the test himself, he is able to give help to others when they are tested."]],"x-john14-6":[[6,"Jesus said to him, I am the true and living way: no one comes to the Father but by me."]],"x-acts4-12":[[12,"And in no other is there salvation: for there is no other name under heaven, given among men, through which we may have salvation."]],"x-1corinthians15-17":[[17,"And if that is so, your faith is of no effect; you are still in your sins."],[18,"And, in addition, the dead in Christ have gone to destruction."],[19,"If in this life only we have hope in Christ, we are of all men most unhappy."],[20,"But now Christ has truly come back from the dead, the first-fruits of those who are sleeping."]],"x-romans6-9":[[9,"Having knowledge that because Christ has come back from the dead, he will never again go down to the dead; death has no more power over him."]],"x-hebrews7-25":[[25,"So that he is fully able to be the saviour of all who come to God through him, because he is ever living to make prayer to God for them."]],"x-exodus34-6":[[6,"And the Lord went past before his eyes, saying, The Lord, the Lord, a God full of pity and grace, slow to wrath and great in mercy and faith;"],[7,"Having mercy on thousands, overlooking evil and wrongdoing and sin; he will not let wrongdoers go free, but will send punishment on children for the sins of their fathers, and on their children's children to the third and fourth generation."]],"x-psalm145-8":[[8,"The Lord is full of grace and pity; not quickly angry, but great in mercy."],[9,"The Lord is good to all men; and his mercies are over all his works."]],"x-isaiah6-3":[[3,"And one said in a loud voice to another, Holy, holy, holy, is the Lord of armies: all the earth is full of his glory."]],"x-1peter1-15":[[15,"But be holy in every detail of your lives, as he, whose servants you are, is holy;"],[16,"Because it has been said in the Writings, You are to be holy, for I am holy."]],"x-lamentations3-22":[[22,"It is through the Lord's love that we have not come to destruction, because his mercies have no limit."],[23,"They are new every morning; great is your good faith."]],"x-1corinthians1-9":[[9,"God is true, through whom you have been given a part with his Son, Jesus Christ our Lord."]],"x-psalm115-3":[[3,"But our God is in heaven: he has done whatever was pleasing to him."]],"x-daniel4-35":[[35,"And all the people of the earth are as nothing: he does his pleasure in the army of heaven and among the people of the earth: and no one is able to keep back his hand, or say to him, What are you doing?"]],"x-2corinthians13-14":[[14,"The grace of our Lord Jesus Christ, and the love of God, and the harmony of the Holy Spirit, be with you all."]],"x-john17-3":[[3,"And this is eternal life: to have knowledge of you, the only true God, and of him whom you have sent, even Jesus Christ."]],"x-jeremiah9-23":[[23,"This is the word of the Lord: Let not the wise man take pride in his wisdom, or the strong man in his strength, or the man of wealth in his wealth:"],[24,"But if any man has pride, let it be in this, that he has the wisdom to have knowledge of me, that I am the Lord, working mercy, giving true decisions, and doing righteousness in the earth: for in these things I have delight, says the Lord."]],"x-psalm119-105":[[105,"- NUN - Your word is a light for my feet, ever shining on my way."]],"x-psalm1-1":[[1,"Happy is the man who does not go in the company of sinners, or take his place in the way of evil-doers, or in the seat of those who do not give honour to the Lord."],[2,"But whose delight is in the law of the Lord, and whose mind is on his law day and night."],[3,"He will be like a tree planted by the rivers of water, which gives its fruit at the right time, whose leaves will ever be green; and he will do well in all his undertakings."]],"x-james1-22":[[22,"But be doers of the word, and not only hearers of it, blinding yourselves with false ideas."],[23,"Because if any man is a hearer of the word and not a doer, he is like a man looking at his natural face in a glass;"],[24,"For after looking at himself he goes away, and in a short time he has no memory of what he was like."],[25,"But he who goes on looking into the true law which makes him free, being not a hearer without memory but a doer putting it into effect, this man will have a blessing on his acts."]],"x-1peter2-2":[[2,"Be full of desire for the true milk of the word, as babies at their mothers' breasts, so that you may go on to salvation;"]],"x-acts17-11":[[11,"Now these were more noble than the Jews of Thessalonica, for they gave serious attention to the word, searching in the holy Writings every day, to see if these things were so."]],"x-hebrews4-14":[[14,"Having then a great high priest, who has made his way through the heavens, even Jesus the Son of God, let us be strong in our faith."]],"x-matthew6-9":[[9,"Let this then be your prayer: Our Father in heaven, may your name be kept holy."],[10,"Let your kingdom come. Let your pleasure be done, as in heaven, so on earth."],[11,"Give us this day bread for our needs."],[12,"And make us free of our debts, as we have made those free who are in debt to us."],[13,"And let us not be put to the test, but keep us safe from the Evil One."]],"x-mark11-22":[[22,"And Jesus, answering, said to them, Have God's faith."],[23,"Truly I say to you, Whoever says to this mountain, Be taken up and be put into the sea; and has no doubt in his heart, but has faith that what he says will come about, he will have his desire."],[24,"For this reason I say to you, Whatever you make a request for in prayer, have faith that it has been given to you, and you will have it."]],"x-james1-5":[[5,"But if any man among you is without wisdom, let him make his request to God, who gives freely to all without an unkind word, and it will be given to him."],[6,"Let him make his request in faith, doubting nothing; for he who has doubt in his heart is like the waves of the sea, which are troubled by the driving of the wind."],[7,"Let it not seem to such a man that he will get anything from the Lord;"],[8,"For there is a division in his mind, and he is uncertain in all his ways."]],"x-1thessalonians5-16":[[16,"Have joy at all times."],[17,"Keep on with your prayers."],[18,"In everything give praise: for this is the purpose of God in Christ Jesus for you."]],"x-colossians4-2":[[2,"Give yourselves to prayer at all times, keeping watch with praise;"]],"x-1john5-14":[[14,"And we are certain that if we make any request to him which is right in his eyes, he will give ear to us:"],[15,"And if we are certain that he gives ear to all our requests, we are equally certain that we will get our requests."]],"x-1john1-3":[[3,"We give you word of all we have seen and everything which has come to our ears, so that you may be united with us; and we are united with the Father and with his Son Jesus Christ:"],[4,"And we are writing these things to you so that our joy may be made complete."],[5,"This is the word which came to us from him and which we give to you, that God is light and in him there is nothing dark."],[6,"If we say we are joined to him, and are walking still in the dark, our words are false and our acts are untrue:"],[7,"But if we are walking in the light, as he is in the light, we are all united with one another, and the blood of Jesus his Son makes us clean from all sin."]],"x-psalm50-15":[[15,"Let your voice come up to me in the day of trouble; I will be your saviour, so that you may give glory to me."]],"x-james5-13":[[13,"Is anyone among you in trouble? let him say prayers. Is anyone glad? let him make a song of praise."],[14,"Is anyone among you ill? let him send for the rulers of the church; and let them say prayers over him, putting oil on him in the name of the Lord."],[15,"And by the prayer of faith the man who is ill will be made well, and he will be lifted up by the Lord, and for any sin which he has done he will have forgiveness."],[16,"So then, make a statement of your sins to one another, and say prayers for one another so that you may be made well. The prayer of a good man is full of power in its working."]],"x-john14-16":[[16,"And I will make prayer to the Father and he will give you another Helper to be with you for ever,"],[17,"Even the Spirit of true knowledge. That Spirit the world is not able to take to its heart because it sees him not and has no knowledge of him: but you have knowledge of him, because he is ever with you and will be in you."]],"x-acts1-8":[[8,"But you will have power, when the Holy Spirit has come on you; and you will be my witnesses in Jerusalem and all Judaea and Samaria, and to the ends of the earth."]],"x-1corinthians3-16":[[16,"Do you not see that you are God's holy house, and that the Spirit of God has his place in you?"]],"x-romans8-9":[[9,"You are not in the flesh but in the Spirit, if the Spirit of God is in you. But if any man has not the Spirit of Christ he is not one of his."],[10,"And if Christ is in you, the body is dead because of sin, but the Spirit is life because of righteousness."],[11,"But if the Spirit of him who made Jesus come again from the dead is in you, he who made Christ Jesus come again from the dead will in the same way, through his Spirit which is in you, give life to your bodies which now are under the power of death."]],"x-john16-13":[[13,"However, when he, the Spirit of true knowledge, has come, he will be your guide into all true knowledge: for his words will not come from himself, but whatever has come to his hearing, that he will say: and he will make clear to you the things to come."],[14,"He will give me glory, because he will take of what is mine, and make it clear to you."],[15,"Everything which the Father has is mine: that is why I say, He will take of what is mine and will make it clear to you."]],"x-galatians5-16":[[16,"But I say, Go on in the Spirit, and you will not come under the rule of the evil desires of the flesh."],[17,"For the flesh has desires against the Spirit, and the Spirit against the flesh; because these are opposite the one to the other; so that you may not do the things which you have a mind to do."],[18,"But if you are guided by the Spirit, you are not under the law."]],"x-1corinthians12-4":[[4,"Now there are different qualities given to men, but the same Spirit."],[5,"And there are different sorts of servants, but the same Lord."],[6,"And there are different operations, but the same God, who is working all things in all."],[7,"But to every man some form of the Spirit's working is given for the common good."],[8,"For to one are given words of wisdom through the Spirit; and to another words of knowledge through the same Spirit:"],[9,"To another faith in the same Spirit; and to another the power of taking away disease, by the one Spirit;"],[10,"And to another the power of working wonders; and to another the prophet's word; and to another the power of testing spirits; to another different sorts of tongues; and to another the power of making clear the sense of the tongues:"],[11,"But all these are the operations of the one and the same Spirit, giving to every man separately as his pleasure is."]],"x-ephesians5-18":[[18,"And do not take overmuch wine by which one may be overcome, but be full of the Spirit;"],[19,"Joining with one another in holy songs of praise and of the Spirit, using your voice in songs and making melody in your heart to the Lord;"],[20,"Giving praise at all times for all things in the name of our Lord Jesus Christ, to God, even the Father;"],[21,"Letting yourselves be ruled by one another in the fear of Christ."]],"x-romans8-26":[[26,"And in the same way the Spirit is a help to our feeble hearts: for we are not able to make prayer to God in the right way; but the Spirit puts our desires into words which are not in our power to say;"],[27,"And he who is the searcher of hearts has knowledge of the mind of the Spirit, because he is making prayers for the saints in agreement with the mind of God."]],"x-hebrews11-1":[[1,"Now faith is the substance of things hoped for, and the sign that the things not seen are true."],[2,"For by it our fathers had God's approval."],[3,"By faith it is clear to us that the order of events was fixed by the word of God, so that what is seen has not been made from things which only seem to be."],[4,"By faith Abel made a better offering to God than Cain, and he had witness through it of his righteousness, God giving his approval of his offering: and his voice still comes to us through it though he is dead."],[5,"By faith Enoch was taken up to heaven so that he did not see death; he was seen no longer, for God took him away: for before he was taken, witness had been given that he was well-pleasing to God:"],[6,"And without faith it is not possible to be well-pleasing to him, for it is necessary for anyone who comes to God to have the belief that God is, and that he is a rewarder of all those who make a serious search for him."]],"x-romans1-17":[[17,"For in it there is the revelation of the righteousness of God from faith to faith: as it is said in the holy Writings, The man who does righteousness will be living by his faith."]],"x-2corinthians5-7":[[7,"(For we are walking by faith, not by seeing,)"]],"x-psalm37-3":[[3,"Have faith in the Lord, and do good; be at rest in the land, and go after righteousness."],[4,"So will your delight be in the Lord, and he will give you your heart's desires."],[5,"Put your life in the hands of the Lord; have faith in him and he will do it."],[6,"And he will make your righteousness be seen like the light, and your cause like the shining of the sun."],[7,"Take your rest in the Lord, waiting quietly for him; do not be angry because of the man who does well in his evil ways, and gives effect to his bad designs."]],"x-philippians4-19":[[19,"And my God will give you all you have need of from the wealth of his glory in Christ Jesus."]],"x-matthew6-25":[[25,"So I say to you, Take no thought for your life, about food or drink, or about clothing for your body. Is not life more than food, and the body more than its clothing?"],[26,"See the birds of heaven; they do not put seeds in the earth, they do not get in grain, or put it in store-houses; and your Father in heaven gives them food. Are you not of much more value than they?"],[27,"And which of you by taking thought is able to make himself a cubit taller?"],[28,"And why are you troubled about clothing? See the flowers of the field, how they come up; they do no work, they make no thread:"],[29,"But I say to you that even Solomon in all his glory was not clothed like one of these."],[30,"But if God gives such clothing to the grass of the field, which is here today and tomorrow is put into the oven, will he not much more give you clothing, O you of little faith?"],[31,"Then do not be full of care, saying, What are we to have for food or drink? or, With what may we be clothed?"],[32,"Because the Gentiles go in search of all these things: for your Father in heaven has knowledge that you have need of all these things:"]],"x-matthew6-34":[[34,"Then have no care for tomorrow: tomorrow will take care of itself. Take the trouble of the day as it comes."]],"x-matthew14-14":[[14,"And he came out and saw a great number of people and he had pity on them, and made well those of them who were ill."]],"x-matthew8-16":[[16,"And in the evening, they took to him a number of people who had evil spirits; and he sent the spirits out of them with a word, and made well all who were ill;"],[17,"So that the word of Isaiah the prophet might come true: He himself took our pains and our diseases."]],"x-1timothy6-6":[[6,"But true faith, with peace of mind, is of great profit:"],[7,"For we came into the world with nothing, and we are not able to take anything out;"],[8,"But if we have food and a roof over us, let that be enough."],[9,"But those who have a desire for wealth are falling into danger, and are taken as in a net by a number of foolish and damaging desires, through which men are overtaken by death and destruction."],[10,"For the love of money is a root of all evil: and some whose hearts were fixed on it have been turned away from the faith, and been wounded with unnumbered sorrows."]],"x-philippians4-11":[[11,"But I will not say anything about my needs, for I am able, wherever I am, to be dependent on myself."],[12,"It is the same to me if I am looked down on or honoured; everywhere and in all things I have the secret of how to be full and how to go without food; how to have wealth and how to be in need."]],"x-james1-2":[[2,"Let it be all joy to you, my brothers, when you undergo tests of every sort;"],[3,"Because you have the knowledge that the testing of your faith gives you the power of going on in hope;"],[4,"But let this power have its full effect, so that you may be made complete, needing nothing."]],"x-romans5-3":[[3,"And not only so, but let us have joy in our troubles: in the knowledge that trouble gives us the power of waiting;"],[4,"And waiting gives experience; and experience, hope:"],[5,"And hope does not put to shame; because our hearts are full of the love of God through the Holy Spirit which is given to us."]],"x-romans5-1":[[1,"For which reason, because we have righteousness through faith, let us be at peace with God through our Lord Jesus Christ;"]],"x-2corinthians5-21":[[21,"For him who had no knowledge of sin God made to be sin for us; so that we might become the righteousness of God in him."]],"x-romans6-6":[[6,"Being conscious that our old man was put to death on the cross with him, so that the body of sin might be put away, and we might no longer be servants to sin."],[7,"Because he who is dead is free from sin."],[8,"But if we are dead with Christ, we have faith that we will be living with him;"]],"x-romans6-10":[[10,"For his death was a death to sin, but his life now is a life which he is living to God."],[11,"Even so see yourselves as dead to sin, but living to God in Christ Jesus."],[12,"For this cause do not let sin be ruling in your body which is under the power of death, so that you give way to its desires;"],[13,"And do not give your bodies to sin as the instruments of wrongdoing, but give yourselves to God, as those who are living from the dead, and your bodies as instruments of righteousness to God."],[14,"For sin may not have rule over you: because you are not under law, but under grace."]],"x-james1-12":[[12,"There is a blessing on the man who undergoes testing; because, if he has God's approval, he will be given the crown of life, which the Lord has said he will give to those who have love for him."],[13,"Let no man say when he is tested, I am tested by God; for it is not possible for God to be tested by evil, and he himself puts no man to such a test:"],[14,"But every man is tested when he is turned out of the right way by the attraction of his desire."],[15,"Then when its time comes, desire gives birth to sin; and sin, when it is of full growth, gives birth to death."]],"x-ephesians4-31":[[31,"Let all bitter, sharp and angry feeling, and noise, and evil words, be put away from you, with all unkind acts;"],[32,"And be kind to one another, full of pity, having forgiveness for one another, even as God in Christ had forgiveness for you."]],"x-colossians3-12":[[12,"As saints of God, then, holy and dearly loved, let your behaviour be marked by pity and mercy, kind feeling, a low opinion of yourselves, gentle ways, and a power of undergoing all things;"],[13,"Being gentle to one another and having forgiveness for one another, if anyone has done wrong to his brother, even as the Lord had forgiveness for you:"],[14,"And more than all, have love; the only way in which you may be completely joined together."]],"x-2peter1-5":[[5,"So, for this very cause, take every care; joining virtue to faith, and knowledge to virtue,"],[6,"And self-control to knowledge, and a quiet mind to self-control, and fear of God to a quiet mind,"],[7,"And love of the brothers to fear of God, and to love of the brothers, love itself."],[8,"For if you have these things in good measure, they will make you fertile and full of fruit in the knowledge of our Lord Jesus Christ."]],"x-philippians2-12":[[12,"So then, my loved ones, as you have at all times done what I say, not only when I am present, but now much more when I am not with you, give yourselves to working out your salvation with fear in your hearts;"],[13,"For it is God who is the cause of your desires and of your acts, for his good pleasure."]],"x-1corinthians12-12":[[12,"For as the body is one, and has a number of parts, and all the parts make one body, so is Christ."],[13,"For through the baptism of the one Spirit we were all formed into one body, Jews or Greeks, servants or free men, and were all made full of the same Spirit."],[14,"For the body is not one part, but a number of parts."],[15,"If the foot says, Because I am not the hand, I am not a part of the body; it is no less a part of the body."],[16,"And if the ear says, Because I am not the eye, I am not a part of the body; it is a part of the body all the same."],[17,"If all the body was an eye, where would be the hearing? if all was hearing, where would be the smelling?"],[18,"But now God has put every one of the parts in the body as it was pleasing to him."],[19,"And if they were all one part, where would the body be?"],[20,"But now they are all different parts, but one body."],[21,"And the eye may not say to the hand, I have no need of you: or again the head to the feet, I have no need of you."],[22,"No, those parts which seem to be feeble are the more necessary;"],[23,"And to those parts of the body which seem to have less honour we give all the more honour; and to those parts of the body which are a cause of shame to us we give the greater respect;"],[24,"But those parts of the body which are beautiful have no need of such care: and so the body has been joined together by God in such a way as to give more honour to those parts which had need of it;"],[25,"So that there might be no division in the body; but all the parts might have the same care for one another."],[26,"And if there is pain in one part of the body, all the parts will be feeling it; or if one part is honoured, all the parts will be glad."],[27,"Now you are the body of Christ, and every one of you the separate parts of it."]],"x-acts2-42":[[42,"And they kept their attention fixed on the Apostles' teaching and were united together in the taking of broken bread and in prayer."],[43,"But fear came on every soul: and all sorts of wonders and signs were done by the Apostles."],[44,"And all those who were of the faith kept together, and had all things in common;"],[45,"And exchanging their goods and property for money, they made division of it among them all, as they had need."],[46,"And day by day, going in agreement together regularly to the Temple and, taking broken bread together in their houses, they took their food with joy and with true hearts,"],[47,"Giving praise to God, and having the approval of all the people; and every day the number of those who had salvation was increased by the Lord."]],"x-john13-34":[[34,"I give you a new law: Have love one for another; even as I have had love for you, so are you to have love one for another."],[35,"By this it will be clear to all men that you are my disciples, if you have love one for another."]],"x-galatians5-13":[[13,"Because you, brothers, were marked out to be free; only do not make use of your free condition to give the flesh its chance, but through love be servants one to another."]],"x-1peter4-10":[[10,"Making distribution among one another of whatever has been given to you, like true servants of the unmeasured grace of God;"]],"x-ephesians4-1":[[1,"I then, the prisoner in the Lord, make this request from my heart, that you will see that your behaviour is a credit to the position which God's purpose has given you,"],[2,"With all gentle and quiet behaviour, taking whatever comes, putting up with one another in love;"],[3,"Taking care to keep the harmony of the Spirit in the yoke of peace."],[4,"There is one body and one Spirit, even as you have been marked out by God in the one hope of his purpose for you;"],[5,"One Lord, one faith, one baptism,"],[6,"One God and Father of all, who is over all, and through all, and in all."]],"x-colossians3-15":[[15,"And let the peace of Christ be ruling in your hearts, as it was the purpose of God for you to be one body; and give praise to God at all times."]],"x-matthew18-15":[[15,"And if your brother does wrong to you, go, make clear to him his error between you and him in private: if he gives ear to you, you have got your brother back again."],[16,"But if he will not give ear to you, take with you one or two more, that by the lips of two or three witnesses every word may be made certain."],[17,"And if he will not give ear to them, let it come to the hearing of the church: and if he will not give ear to the church, let him be to you as a Gentile and a tax-farmer."]],"x-ephesians4-11":[[11,"And he gave some as Apostles, and some, prophets; and some, preachers of the good news; and some to give care and teaching;"],[12,"For the training of the saints as servants in the church, for the building up of the body of Christ:"],[13,"Till we all come to the harmony of the faith, and of the knowledge of the Son of God, to full growth, to the full measure of Christ:"],[14,"So that we may be no longer children, sent this way and that, turned about by every wind of teaching, by the twisting and tricks of men, by the deceits of error;"],[15,"But saying true words in love, may come to full growth in him, who is the head, even Christ;"],[16,"Through whom all the body, being rightly formed and united together, by the full working of every part, is increased to the building up of itself in love."]],"x-james4-7":[[7,"For this cause be ruled by God; but make war on the Evil One and he will be put to flight before you."],[8,"Come near to God and he will come near to you. Make your hands clean, you evil-doers; put away deceit from your hearts, you false in mind."]],"x-1peter5-8":[[8,"Be serious and keep watch; the Evil One, who is against you, goes about like a lion with open mouth in search of food;"],[9,"Do not give way to him but be strong in your faith, in the knowledge that your brothers who are in the world undergo the same troubles."]],"x-colossians2-13":[[13,"And you, being dead through your sins and the evil condition of your flesh, to you, I say, he gave life together with him, and forgiveness of all our sins;"],[14,"Having put an end to the handwriting of the law which was against us, taking it out of the way by nailing it to his cross;"],[15,"Having made himself free from the rule of authorities and powers, he put them openly to shame, glorying over them in it."]],"x-luke10-17":[[17,"And the seventy came back with joy, saying, Lord, even the evil spirits are under our power in your name."],[18,"And he said, I was watching for Satan, falling from heaven like a star."],[19,"See, I have given you power to put your feet on snakes and evil beasts, and over all the strength of him who is against you: and nothing will do you damage."],[20,"Do not be glad, however, because you have power over spirits, but because your names are recorded in heaven."]],"x-romans8-37":[[37,"But we are able to overcome all these things and more through his love."]],"x-1john5-4":[[4,"Anything which comes from God is able to overcome the world: and the power by which we have overcome the world is our faith."],[5,"Who is able to overcome the world but the man who has faith that Jesus is the Son of God?"]],"x-2corinthians10-3":[[3,"For though we may be living in the flesh, we are not fighting after the way of the flesh"],[4,"(For the arms with which we are fighting are not those of the flesh, but are strong before God for the destruction of high places);"],[5,"Putting an end to reasonings, and every high thing which is lifted up against the knowledge of God, and causing every thought to come under the authority of Christ;"]],"x-1john4-1":[[1,"My loved ones, do not put your faith in every spirit, but put them to the test, to see if they are from God: because a great number of false prophets have gone out into the world."],[2,"By this you may have knowledge of the Spirit of God: every spirit which says that Jesus Christ has come in the flesh is of God:"],[3,"And every spirit which does not say this is not from God: this is the spirit of Antichrist, of which you have had word; and it is in the world even now."],[4,"You are of God, my little children, and you have overcome them because he who is in you is greater than he who is in the world."]],"x-matthew5-13":[[13,"You are the salt of the earth; but if its taste goes from the salt, how will you make it salt again? it is then good for nothing but to be put out and crushed under foot by men."],[14,"You are the light of the world. A town put on a hill may be seen by all."],[15,"And a burning light is not put under a vessel, but on its table; so that its rays may be shining on all who are in the house."]],"x-1corinthians13-1":[[1,"If I make use of the tongues of men and of angels, and have not love, I am like sounding brass, or a loud-tongued bell."],[2,"And if I have a prophet's power, and have knowledge of all secret things; and if I have all faith, by which mountains may be moved from their place, but have not love, I am nothing."],[3,"And if I give all my goods to the poor, and if I give my body to be burned, but have not love, it is of no profit to me."],[4,"Love is never tired of waiting; love is kind; love has no envy; love has no high opinion of itself, love has no pride;"],[5,"Love's ways are ever fair, it takes no thought for itself; it is not quickly made angry, it takes no account of evil;"],[6,"It takes no pleasure in wrongdoing, but has joy in what is true;"],[7,"Love has the power of undergoing all things, having faith in all things, hoping all things."]],"x-proverbs10-9":[[9,"He whose ways are upright will go safely, but he whose ways are twisted will be made low."]],"x-titus2-7":[[7,"In all things see that you are an example of good works; holy in your teaching, serious in behaviour,"],[8,"Saying true and right words, against which no protest may be made, so that he who is not on our side may be put to shame, unable to say any evil of us."]],"x-colossians3-23":[[23,"Whatever you do, do it readily, as to the Lord and not to men;"],[24,"Being certain that the Lord will give you the reward of the heritage: for you are the servants of the Lord Christ."]],"x-luke16-10":[[10,"He who is true in a little, is true in much; he who is false in small things, is false in great."],[11,"If, then, you have not been true in your use of the wealth of this life, who will give into your care the true wealth?"],[12,"And if you have not been true in your care of the property of other people, who will give you that which is yours?"]],"x-2corinthians9-6":[[6,"But in the Writings it says, He who puts in only a small number of seeds, will get in the same; and he who puts them in from a full hand, will have produce in full measure from them."],[7,"Let every man do after the purpose of his heart; not giving with grief, or by force: for God takes pleasure in a ready giver."],[8,"And God is able to give you all grace in full measure; so that ever having enough of all things, you may be full of every good work:"]],"x-ephesians4-29":[[29,"Let no evil talk come out of your mouth, but only what is good for giving necessary teaching, and for grace to those who give ear."]],"x-james1-19":[[19,"You have knowledge of this, dear brothers. But let every man be quick in hearing, slow in words, slow to get angry;"]],"x-romans12-17":[[17,"Do not give evil for evil to any man. Let all your business be well ordered in the eyes of all men."],[18,"As far as it is possible for you be at peace with all men."],[19,"Do not give punishment for wrongs done to you, dear brothers, but give way to the wrath of God; for it is said in the holy Writings, Punishment is mine, I will give reward, says the Lord."],[20,"But if one who has hate for you is in need of food or of drink, give it to him, for in so doing you will put coals of fire on his head."],[21,"Do not let evil overcome you, but overcome evil by good."]],"x-philippians1-9":[[9,"And my prayer is that you may be increased more and more in knowledge and experience;"],[10,"So that you may give your approval to the best things; that you may be true and without wrongdoing till the day of Christ;"],[11,"Being full of the fruits of righteousness, which are through Jesus Christ, to the glory and praise of God."]],"x-matthew28-18":[[18,"And Jesus came to them and said, All authority has been given to me in heaven and on earth."]],"x-1peter3-16":[[16,"Being conscious that you have done no wrong; so that those who say evil things about your good way of life as Christians may be put to shame."]],"x-2timothy2-1":[[1,"So then, my child, be strong in the grace which is in Christ Jesus."],[2,"And the things which I have said to you before a number of witnesses, give to those of the faith, so that they may be teachers of others."]],"x-hebrews12-1":[[1,"For this reason, as we are circled by so great a cloud of witnesses, putting off every weight, and the sin into which we come so readily, let us keep on running in the way which is marked out for us,"],[2,"Having our eyes fixed on Jesus, the guide and end of our faith, who went through the pains of the cross, not caring for the shame, because of the joy which was before him, and who has now taken his place at the right hand of God's seat of power."],[3,"Give thought to him who has undergone so much of the hate of sinners against himself, so that you may not be tired and feeble of purpose."]],"x-1thessalonians4-16":[[16,"Because the Lord himself will come down from heaven with a word of authority, with the voice of the chief angel, with the sound of a horn: and the dead in Christ will come to life first;"],[17,"Then we who are still living will be taken up together with them into the clouds to see the Lord in the air: and so will we be for ever with the Lord."],[18,"So then, give comfort to one another with these words."]],"x-1corinthians15-51":[[51,"See, I am giving you the revelation of a secret: we will not all come to the sleep of death, but we will all be changed."],[52,"In a second, in the shutting of an eye, at the sound of the last horn: for at that sound the dead will come again, free for ever from the power of death, and we will be changed."],[53,"For this body which comes to destruction will be made free from the power of death, and the man who is under the power of death will put on eternal life."],[54,"But when this has taken place, then that which was said in the Writings will come true, Death is overcome by life."],[55,"O death, where is your power? O death, where are your pains?"],[56,"The pain of death is sin; and the power of sin is the law:"],[57,"But praise be to God who gives us strength to overcome through our Lord Jesus Christ."]],"x-revelation21-1":[[1,"And I saw a new heaven and a new earth: for the first heaven and the first earth were gone; and there was no more sea."],[2,"And I saw the holy town, new Jerusalem, coming down out of heaven from God, like a bride made beautiful for her husband."],[3,"And there came to my ears a great voice out of the high seat, saying, See, the Tent of God is with men, and he will make his living-place with them, and they will be his people, and God himself will be with them, and be their God."],[4,"And he will put an end to all their weeping; and there will be no more death, or sorrow, or crying, or pain; for the first things have come to an end."],[5,"And he who is seated on the high seat said, See, I make all things new. And he said, Put it in the book; for these words are certain and true."]],"x-colossians3-1":[[1,"If then you have a new life with Christ, give your attention to the things of heaven, where Christ is seated at the right hand of God."],[2,"Keep your mind on the higher things, not on the things of earth."],[3,"For your life on earth is done, and you have a secret life with Christ in God."],[4,"At the coming of Christ who is our life, you will be seen with him in glory."]]}};
  var CURRICULUM = {"levels":[{"n":1,"name":"New Birth","desc":"For new believers establishing their understanding of the gospel, salvation, Jesus Christ, the Bible, and their new identity in Christ."},{"n":2,"name":"Established Believer","desc":"For believers developing consistent fellowship with God, understanding the Holy Spirit, growing in faith, and learning to live according to Scripture."},{"n":3,"name":"Growing Disciple","desc":"For believers growing in spiritual maturity, Christian character, church participation, spiritual authority, service, evangelism, and their eternal hope."}],"modules":[{"id":"gospel","level":1,"title":"The Gospel and Salvation","purpose":"Establish a clear understanding of humanity’s need for salvation, the death and resurrection of Jesus Christ, salvation by grace through faith, repentance, and assurance of salvation.","note":null,"topics":[{"t":"Humanity’s need for salvation","refs":["Romans 3:23","Romans 6:23"]},{"t":"God’s love and the gift of salvation","refs":["John 3:16–18","Romans 5:8"]},{"t":"The death and resurrection of Jesus","refs":["1 Corinthians 15:3–4","1 Peter 2:24"]},{"t":"Salvation by grace through faith","refs":["Ephesians 2:8–9","Titus 3:5–7"]},{"t":"Repentance and faith","refs":["Mark 1:15","Acts 3:19"]},{"t":"Confessing and believing in Christ","refs":["Romans 10:9–13"]},{"t":"Assurance of eternal life","refs":["1 John 5:11–13","John 5:24"]}],"priority":["1 Corinthians 15:3–4","Ephesians 2:8–9","1 John 5:11–12","Romans 10:9"]},{"id":"jesus","level":1,"title":"The Person of Jesus Christ","purpose":"Establish the identity of Jesus Christ, including His deity, humanity, incarnation, sinlessness, death, resurrection, and present position.","note":null,"topics":[{"t":"Jesus as the Word who was with God and is God","refs":["John 1:1–3"]},{"t":"The incarnation","refs":["John 1:14","Philippians 2:5–8"]},{"t":"The deity of Christ","refs":["Colossians 1:15–16","Colossians 2:9","Hebrews 1:1–3"]},{"t":"The humanity of Christ","refs":["Hebrews 2:14–18","Hebrews 4:15"]},{"t":"Jesus as the only way to the Father","refs":["John 14:6","Acts 4:12"]},{"t":"The resurrection of Jesus","refs":["1 Corinthians 15:17–20","Romans 6:9"]},{"t":"Christ’s present reign and intercession","refs":["Ephesians 1:20–23","Hebrews 7:25"]}],"priority":["John 1:1","John 1:14","John 14:6","Colossians 2:9"]},{"id":"god","level":1,"title":"Understanding God","purpose":"Introduce the character of God, His holiness, love, faithfulness, sovereignty, and the biblical understanding of the Father, Son, and Holy Spirit.","note":null,"topics":[{"t":"God’s nature and character","refs":["Exodus 34:6–7","Psalm 145:8–9"]},{"t":"God is holy","refs":["Isaiah 6:3","1 Peter 1:15–16"]},{"t":"God is love","refs":["1 John 4:7–10"]},{"t":"God’s faithfulness","refs":["Lamentations 3:22–23","1 Corinthians 1:9"]},{"t":"God’s sovereignty","refs":["Psalm 115:3","Daniel 4:35"]},{"t":"The Father, Son, and Holy Spirit","refs":["Matthew 28:19","2 Corinthians 13:14"]},{"t":"Knowing God personally","refs":["John 17:3","Jeremiah 9:23–24"]}],"priority":["Matthew 28:19","1 John 4:9–10","Lamentations 3:22–23"]},{"id":"word","level":1,"title":"The Bible and the Word of God","purpose":"Establish confidence in Scripture and encourage consistent engagement with the Word through recitation, meditation, understanding, and application.","note":null,"topics":[{"t":"Scripture is inspired by God","refs":["2 Timothy 3:16–17"]},{"t":"The Word of God is living and active","refs":["Hebrews 4:12"]},{"t":"The Word as a lamp and light","refs":["Psalm 119:105"]},{"t":"Meditating on the Word","refs":["Joshua 1:8","Psalm 1:1–3"]},{"t":"Receiving and obeying the Word","refs":["James 1:22–25"]},{"t":"The importance of Scripture in spiritual growth","refs":["1 Peter 2:2"]},{"t":"Testing teachings against Scripture","refs":["Acts 17:11"]}],"priority":["2 Timothy 3:16–17","Psalm 119:105","Psalm 1:1–3","Joshua 1:8"]},{"id":"prayer","level":2,"title":"Prayer and Fellowship with God","purpose":"Help believers develop a consistent prayer life, understand prayer biblically, grow in fellowship with God, and approach Him with confidence.","note":null,"topics":[{"t":"Approaching God through Christ","refs":["Hebrews 4:14–16"]},{"t":"The Lord’s Prayer as a model","refs":["Matthew 6:9–13"]},{"t":"Praying with faith","refs":["Mark 11:22–24","James 1:5–8"]},{"t":"Praying continually","refs":["1 Thessalonians 5:16–18"]},{"t":"Prayer and thanksgiving","refs":["Philippians 4:6–7","Colossians 4:2"]},{"t":"Praying according to God’s will","refs":["1 John 5:14–15"]},{"t":"Fellowship with God","refs":["1 John 1:3–7"]},{"t":"Prayer in times of trouble","refs":["Psalm 50:15","James 5:13–16"]}],"priority":["Philippians 4:6–7","1 Thessalonians 5:17","Hebrews 4:16","1 John 5:14–15"]},{"id":"spirit","level":2,"title":"The Holy Spirit","purpose":"Help believers understand the person and work of the Holy Spirit, His indwelling presence, guidance, empowerment, and role in developing Christian character.","note":null,"topics":[{"t":"The promise of the Holy Spirit","refs":["John 14:16–17","Acts 1:8"]},{"t":"The indwelling of the Holy Spirit","refs":["1 Corinthians 3:16","Romans 8:9–11"]},{"t":"The Spirit’s work in the believer","refs":["John 16:13–15"]},{"t":"Walking in the Spirit","refs":["Galatians 5:16–18"]},{"t":"The fruit of the Spirit","refs":["Galatians 5:22–23"]},{"t":"Spiritual gifts and service","refs":["1 Corinthians 12:4–11"]},{"t":"Being filled with the Spirit","refs":["Ephesians 5:18–21"]},{"t":"The Spirit’s help in prayer","refs":["Romans 8:26–27"]}],"priority":["Acts 1:8","Galatians 5:22–23","Romans 8:9–11","Romans 8:26–27"]},{"id":"faith","level":2,"title":"Faith, Healing, and Divine Provision","purpose":"Build a biblical understanding of faith, trusting God, healing, provision, contentment, and dependence on Him in difficult circumstances.","note":"These Scriptures speak of God’s care, of prayer for the sick, and of provision. They sit alongside Scripture’s teaching on suffering, patience, wisdom and contentment (see the last two topics). Not every illness is healed straight away, not every believer becomes wealthy, and a request that goes unanswered isn’t proof of weak faith. Trust God’s care, pray, seek wise help, and keep going.","topics":[{"t":"What faith is","refs":["Hebrews 11:1–6"]},{"t":"Living by faith","refs":["Romans 1:16–17","2 Corinthians 5:7"]},{"t":"Trusting God","refs":["Proverbs 3:5–6","Psalm 37:3–7"]},{"t":"God’s provision","refs":["Philippians 4:19","Matthew 6:25–34"]},{"t":"Prayer for healing","refs":["James 5:14–16"]},{"t":"Jesus’ compassion toward the sick","refs":["Matthew 14:14","Matthew 8:16–17"]},{"t":"Contentment and godliness","refs":["1 Timothy 6:6–10","Philippians 4:11–13"]},{"t":"Persevering through trials","refs":["James 1:2–4","Romans 5:3–5"]}],"priority":["Hebrews 11:6","Proverbs 3:5–6","Philippians 4:19","Philippians 4:11–13"]},{"id":"newlife","level":2,"title":"New Life in Christ","purpose":"Help believers understand their new identity in Christ and develop a lifestyle shaped by the gospel.","note":null,"topics":[{"t":"A new creation in Christ","refs":["2 Corinthians 5:17"]},{"t":"No condemnation in Christ","refs":["Romans 8:1–2"]},{"t":"Righteousness and justification","refs":["Romans 5:1","2 Corinthians 5:21"]},{"t":"Freedom from sin’s dominion","refs":["Romans 6:6–14"]},{"t":"Renewing the mind","refs":["Romans 12:1–2"]},{"t":"Overcoming temptation","refs":["1 Corinthians 10:13","James 1:12–15"]},{"t":"Forgiveness and reconciliation","refs":["Ephesians 4:31–32","Colossians 3:12–14"]},{"t":"Growing in Christlikeness","refs":["2 Peter 1:5–8","Philippians 2:12–13"]}],"priority":["2 Corinthians 5:17","Romans 8:1","Romans 12:2","1 Corinthians 10:13"]},{"id":"church","level":3,"title":"Church and Christian Fellowship","purpose":"Teach the importance of belonging to the body of Christ, Christian fellowship, mutual encouragement, love, service, and unity.","note":null,"topics":[{"t":"The Church as the body of Christ","refs":["1 Corinthians 12:12–27"]},{"t":"Fellowship among believers","refs":["Acts 2:42–47"]},{"t":"The importance of gathering together","refs":["Hebrews 10:24–25"]},{"t":"Loving one another","refs":["John 13:34–35"]},{"t":"Serving one another","refs":["Galatians 5:13","1 Peter 4:10"]},{"t":"Unity in Christ","refs":["Ephesians 4:1–6"]},{"t":"Forgiveness and reconciliation within the Church","refs":["Colossians 3:13–15","Matthew 18:15–17"]},{"t":"Spiritual leadership and maturity","refs":["Ephesians 4:11–16"]}],"priority":["John 13:34–35","Hebrews 10:24–25","1 Peter 4:10"]},{"id":"warfare","level":3,"title":"Spiritual Warfare and the Believer’s Authority","purpose":"Introduce the biblical reality of spiritual opposition, the believer’s identity and authority in Christ, and the importance of standing firm in faith and truth.","note":null,"topics":[{"t":"The reality of spiritual opposition","refs":["Ephesians 6:10–12"]},{"t":"The armour of God","refs":["Ephesians 6:13–18"]},{"t":"Resisting the devil","refs":["James 4:7–8","1 Peter 5:8–9"]},{"t":"Christ’s victory over spiritual powers","refs":["Colossians 2:13–15"]},{"t":"Authority and victory in Christ","refs":["Luke 10:17–20","Romans 8:37–39"]},{"t":"Overcoming through faith","refs":["1 John 5:4–5"]},{"t":"Standing firm in the gospel","refs":["2 Corinthians 10:3–5"]},{"t":"The importance of truth and discernment","refs":["1 John 4:1–4"]}],"priority":["Ephesians 6:11","James 4:7","1 John 5:4–5"]},{"id":"living","level":3,"title":"Christian Living in the World","purpose":"Help believers live out their faith in their character, relationships, work, speech, decisions, and responsibilities.","note":null,"topics":[{"t":"Living as a representative of Christ","refs":["Matthew 5:13–16"]},{"t":"Love as the defining mark of Christian life","refs":["1 Corinthians 13:1–7"]},{"t":"Integrity and godly character","refs":["Proverbs 10:9","Titus 2:7–8"]},{"t":"Honouring God in daily work","refs":["Colossians 3:23–24"]},{"t":"Stewardship and responsibility","refs":["Luke 16:10–12"]},{"t":"Giving and generosity","refs":["2 Corinthians 9:6–8"]},{"t":"Wisdom in speech and relationships","refs":["Ephesians 4:29","James 1:19"]},{"t":"Handling anxiety and life’s pressures","refs":["Matthew 6:25–34","1 Peter 5:7"]},{"t":"Pursuing peace and forgiveness","refs":["Romans 12:17–21"]},{"t":"Growing in wisdom and discernment","refs":["James 1:5","Philippians 1:9–11"]}],"priority":["Matthew 5:16","Colossians 3:23","Ephesians 4:29","1 Peter 5:7"]},{"id":"mission","level":3,"title":"Mission and the Future of the Believer","purpose":"Establish the believer’s role in the Great Commission, the importance of sharing the gospel, perseverance in the Christian journey, and the hope of Christ’s return and eternity.","note":null,"topics":[{"t":"The Great Commission","refs":["Matthew 28:18–20"]},{"t":"Being a witness for Christ","refs":["Acts 1:8"]},{"t":"The gospel as the power of God","refs":["Romans 1:16"]},{"t":"Sharing the gospel with wisdom","refs":["1 Peter 3:15–16"]},{"t":"Making disciples","refs":["2 Timothy 2:1–2"]},{"t":"Persevering in the Christian race","refs":["Hebrews 12:1–3"]},{"t":"The hope of Christ’s return","refs":["1 Thessalonians 4:16–18"]},{"t":"The resurrection and eternal life","refs":["1 Corinthians 15:51–57"]},{"t":"The new heaven and new earth","refs":["Revelation 21:1–5"]},{"t":"Living with an eternal perspective","refs":["Colossians 3:1–4"]}],"priority":["Matthew 28:19–20","Romans 1:16","Hebrews 12:1–2","Revelation 21:4"]}]};

      rec.onerror = function (e) {
        if (my !== rec) return;
        if (e.error === "no-speech" || e.error === "aborted") return;
        var msg = INSECURE ? FILE_MSG : e.error === "not-allowed" || e.error === "service-not-allowed"
          ? "This page isn’t being allowed to use the microphone (error: " + e.error + "). The page may be blocked from it even if Chrome has permission."
          : e.error === "audio-capture" ? "No microphone was found (error: audio-capture)."
          : e.error === "network" ? "Speech recognition needs an internet connection (error: network)."
          : "Speech recognition stopped (error: " + e.error + ").";
        failListening(msg);
      };
      rec.onend = function () {
        if (my !== rec) return;
        if (wantListening) {
          if (!gotAny && Date.now() - startedAt < 2000) quickEnds++;
          if (quickEnds >= 2) { failListening("Listening kept stopping before hearing anything."); return; }
          startedAt = Date.now();
          var joined = joinText(baseText, sessionText); baseText = joined ? joined + " " : ""; sessionText = "";
          try { rec.start(); return; } catch (er) {}
        }
        state.listening = false; wantListening = false; syncMic();
        var box = document.getElementById("spoken"); if (box) box.value = state.spoken;
        if (!state.speakErr) setSpeakMsg(state.spoken ? "Stopped. Press Check to compare." : "", false);
      };
      wantListening = true; state.listening = true;
      setSpeakMsg("Listening…", false); syncMic();
      rec.start();
    } catch (er) {
      wantListening = false; state.listening = false; syncMic();
      failListening("Couldn’t start the microphone.");
    }
  }
  function stopListening() {
    wantListening = false;
    if (rec && state.listening) { try { rec.stop(); } catch (er) {} }
    state.listening = false; syncMic();
  }

  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("kjv-verses-theme", next); } catch (e) {}
  });

  favs = favs.filter(function (x) { return typeof x === "string"; });
  if (state.view === "favs") { var fu1 = favUnits(); if (fu1.length) { state.pid = fu1[0].id; state.fpid = fu1[0].id; } }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { markDay(1); if (state.view === "days") renderConsistency(); } });
  render();
})();
</script>
