<style>
:root {
  --bg: #EDF1F5;
  --surface: #F8FAFC;
  --ink: #16233B;
  --ink-soft: #55627A;
  --line: #CBD5E1;
  --accent: #B4761A;
  --accent-ink: #FFFFFF;
  --good: #3F7A5C;
  --good-bg: #DDEEE5;
  --warn-bg: #F6E7C8;
  --bad: #A8432F;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1829; --surface: #172238; --ink: #E7ECF4; --ink-soft: #9AA7BE;
    --line: #2B3957; --accent: #E2AE4A; --accent-ink: #1A1305;
    --good: #7CC3A0; --good-bg: #1B3A2E; --warn-bg: #43361A; --bad: #E58A76;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1829; --surface: #172238; --ink: #E7ECF4; --ink-soft: #9AA7BE;
  --line: #2B3957; --accent: #E2AE4A; --accent-ink: #1A1305;
  --good: #7CC3A0; --good-bg: #1B3A2E; --warn-bg: #43361A; --bad: #E58A76;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.app { max-width: 1060px; margin: 0 auto; padding: 20px 16px 56px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-soft); font-size: 0.9rem; margin: 2px 0 0; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; color: var(--ink-soft); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.views { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
@media (max-width: 520px) { .view-btn { padding: 7px 12px !important; font-size: 0.88rem !important; } }
.view-btn .vb-n { opacity: 0.75; font-weight: 400; }
.layout.solo { grid-template-columns: 1fr !important; }
.layout.solo .side { display: none; }
.titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.titlerow h2 { margin-right: auto; }
.favbtn { flex: none; border: 1px solid var(--line); background: none; color: var(--ink-soft); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer; }
.favbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.favbtn .st { color: var(--accent); font-size: 1.05em; }
.fstar { color: var(--accent); margin-right: 4px; }
.empty { color: var(--ink-soft); max-width: 52ch; }
.stats-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin: 18px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.9rem; line-height: 1.1; }
.stat span { font-size: 0.82rem; color: var(--ink-soft); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 360px; margin: 10px 0 8px; }
.cal .dow { text-align: center; font-size: 0.72rem; color: var(--ink-soft); }
.cal .day { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: none; }
.cal .day.on { background: color-mix(in srgb, var(--accent) 38%, transparent); border-color: transparent; }
.cal .day.did { background: var(--accent); border-color: transparent; }
.cal .day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal .day.future { opacity: 0.35; border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--ink-soft); margin: 4px 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.legend i.on { background: color-mix(in srgb, var(--accent) 38%, transparent); border-color: transparent; }
.legend i.did { background: var(--accent); border-color: transparent; }

.view-btn { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 18px; font-size: 0.95rem; font-weight: 500; color: var(--ink-soft); }
.view-btn[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 16px; font-size: 0.9rem; color: var(--ink-soft); }
.crumb .btn { padding: 6px 12px; }
.lead { color: var(--ink-soft); max-width: 62ch; margin: 0 0 8px; }
.lvl { margin: 28px 0 6px; }
.lvl h3 { font-family: var(--serif); font-weight: 500; font-size: 1.4rem; margin: 0 0 2px; letter-spacing: -0.01em; }
.lvl p { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 8px; max-width: 62ch; }
.mrow { display: grid; gap: 4px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 4px; }
.mrow:hover .mt { text-decoration: underline; text-underline-offset: 3px; }
.mt { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
.mp { color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }
.mm { font-size: 0.8rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.sect { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; margin: 24px 0 8px; }
.refs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
.refbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 12px; font-size: 0.92rem; font-weight: 500; }
.refbtn:hover { border-color: var(--ink-soft); }
.refbtn.key { border-color: var(--accent); }
.topic { margin: 0 0 16px; }
.topic h4 { font-family: var(--serif); font-weight: 500; font-size: 1.08rem; margin: 0 0 6px; }
.caution { background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; max-width: 62ch; margin: 0 0 16px; }
.layout { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .layout { grid-template-columns: 260px 1fr; align-items: start; } }

/* passage picker */
.side { min-width: 0; }
.picker { display: grid; gap: 8px; }
.picker select { width: 100%; font: inherit; font-size: 1rem; padding: 12px 12px; border: 1px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink); }
.picker .stats { font-size: 0.85rem; color: var(--ink-soft); }
.passages { display: none; }
@media (min-width: 900px) {
  .picker { display: none; }
  .side { position: sticky; top: 16px; }
  .passages { display: block; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 6px; }
}
.grp { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; font-family: var(--serif); font-size: 1.02rem; font-weight: 500; color: var(--ink); }
.grp:first-child { margin-top: 0; }
.grp span { font-family: var(--sans); font-size: 0.78rem; color: var(--ink-soft); font-weight: 400; }
.p-btn {
  width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px;
  display: grid; gap: 3px;
}
.p-btn:hover { border-color: var(--line); }
.p-btn[aria-current="true"] { background: var(--surface); border-color: var(--ink); box-shadow: inset 4px 0 0 var(--accent); }
.p-ref { font-size: 0.97rem; font-weight: 500; }
.p-meta { font-size: 0.78rem; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 12px; height: 4px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--good); }
.due { color: var(--accent); font-weight: 600; }
.pager { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 22px; }

/* main panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px 20px; }
@media (min-width: 640px) { .panel { padding: 30px 34px 26px; } }
.panel h2 { font-family: var(--serif); font-weight: 500; font-size: 1.9rem; margin: 0 0 14px; letter-spacing: -0.01em; }

.modes { display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 14px; }
.mode { flex: 1 1 auto; background: none; border: 0; border-radius: 7px; padding: 8px 10px; font-size: 0.95rem; color: var(--ink-soft); font-weight: 500; }
.mode[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.ver-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 14px; }
.ver-row label { font-size: 0.9rem; color: var(--ink-soft); }
.ver-row select { font: inherit; font-size: 0.95rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 100%; }
.links { font-size: 0.88rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 0 0 16px; }
.links a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.editor-note { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 12px; max-width: 62ch; }
.verse-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; color: var(--ink-soft); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.hint { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 16px; max-width: 60ch; }

/* scripture text */
.scripture { font-family: var(--serif); font-size: 1.3rem; line-height: 1.85; max-width: 62ch; margin: 0 0 22px; }
@media (min-width: 640px) { .scripture { font-size: 1.45rem; } }
.scripture sup { font-family: var(--sans); font-size: 0.62em; color: var(--accent); font-weight: 600; margin-right: 3px; vertical-align: 0.5em; }
.vblock { display: block; margin-bottom: 6px; }
.w { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; display: inline; }
.w.hide { color: transparent; border-bottom: 2px solid var(--ink-soft); user-select: none; }
.w.hide:hover { border-bottom-color: var(--accent); }
.w.show-again { color: var(--accent); }
.w.initial { letter-spacing: 0.06em; }

.controls { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin-bottom: 22px; }
.controls label { font-size: 0.92rem; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
input[type=range] { accent-color: var(--accent); width: 190px; }
.btn { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; font-size: 0.92rem; font-weight: 500; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }

textarea {
  width: 100%; min-height: 180px; resize: vertical; padding: 14px;
  font-family: var(--serif); font-size: 1.2rem; line-height: 1.6;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.check-label { font-size: 0.92rem; color: var(--ink-soft); display: inline-flex; gap: 8px; align-items: center; }
.hint-block { font-family: var(--serif); font-size: 1.1rem; line-height: 1.7; color: var(--ink-soft); background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }

.mic-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 14px; }
.mic { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 12px 22px; font-size: 1rem; font-weight: 600; }
.mic .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.mic[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.mic[aria-pressed="true"] .dot { background: #fff; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
.speak-msg { font-size: 0.9rem; color: var(--ink-soft); }
.speak-msg.err { color: var(--bad); }
.note { font-size: 0.85rem; color: var(--ink-soft); margin: 4px 0 0; max-width: 62ch; }
.result { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; }
.score { font-family: var(--serif); font-size: 2.2rem; font-weight: 500; margin: 0; }
.score small { font-family: var(--sans); font-size: 0.95rem; color: var(--ink-soft); font-weight: 400; margin-left: 8px; }
.diff { font-family: var(--serif); font-size: 1.25rem; line-height: 1.9; max-width: 62ch; margin: 10px 0 8px; }
.diff .ok { color: var(--ink); }
.diff .miss { background: var(--warn-bg); border-radius: 3px; padding: 0 3px; }
.diff .extra { color: var(--bad); text-decoration: line-through; }
.legend { font-size: 0.85rem; color: var(--ink-soft); }

.rate { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.rate p { margin: 0 0 10px; font-weight: 500; }
.rate .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.rate .opt { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; font-size: 0.92rem; }
.rate .opt[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--ink); }
.saved { font-size: 0.85rem; color: var(--good); margin-left: 6px; }
.foot { color: var(--ink-soft); font-size: 0.82rem; margin-top: 22px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div>
      <h1>Hid in my heart</h1>

</div>

    "eph1-15": [[15, "For this cause I, having had news of the faith in the Lord Jesus which is among you, and which you make clear to all the saints,"], [16, "Give praise without end for you, keeping you in mind in my prayers;"], [17, "That the God of our Lord Jesus Christ, the Father of glory, may give to you a spirit of wisdom and revelation in the knowledge of him;"], [18, "And that having the eyes of your heart full of light, you may have knowledge of what is the hope of his purpose, what is the wealth of the glory of his heritage in the saints,"], [19, "And how unlimited is his power to us who have faith, as is seen in the working of the strength of his power,"], [20, "By which he made Christ come back from the dead, and gave him a place at his right hand in heaven,"], [21, "Far over all rule and authority and power and every name which is named, not only in the present order, but in that which is to come:"], [22, "And he has put all things under his feet, and has made him to be head over all things to the church,"], [23, "Which is his body, the full measure of him in whom all things are made complete."]],
    "eph3-14": [[14, "For this cause I go down on my knees before the Father,"], [15, "From whom every family in heaven and on earth is named,"], [16, "That in the wealth of his glory he would make you strong with power through his Spirit in your hearts;"], [17, "So that Christ may have his place in your hearts through faith; and that you, being rooted and based in love,"], [18, "May have strength to see with all the saints how wide and long and high and deep it is,"], [19, "And to have knowledge of the love of Christ which is outside all knowledge, so that you may be made complete as God himself is complete."], [20, "Now to him who is able to do in full measure more than all our desires or thoughts, through the power which is working in us,"], [21, "To him be the glory in the church and in Christ Jesus to all generations for ever and ever. So be it."]],
    "1jn3-13": [[13, "Do not be surprised, my brothers, if the world has no love for you."], [14, "We are conscious that we have come out of death into life because of our love for the brothers. He who has no love is still in death."], [15, "Anyone who has hate for his brother is a taker of life, and you may be certain that no taker of life has eternal life in him."], [16, "In this we see what love is, because he gave his life for us; and it is right for us to give our lives for the brothers."]],
    "rom3-23": [[23, "For all have done wrong and are far from the glory of God;"]],
    "rom6-23": [[23, "For the reward of sin is death; but what God freely gives is eternal life in Jesus Christ our Lord."]],
    "rom5-8": [[8, "But God has made clear his love to us, in that, when we were still sinners, Christ gave his life for us."]],
    "john3-16": [[16, "For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life."]],
    "col1-15": [[15, "Who is the image of the unseen God coming into existence before all living things;"], [16, "For by him all things were made, in heaven and on earth, things seen and things unseen, authorities, lords, rulers, and powers; all things were made by him and for him;"]],
    "eph2-8": [[8, "Because by grace you have salvation through faith; and that not of yourselves: it is given by God:"], [9, "Not by works, so that no man may take glory to himself."], [10, "For by his act we were given existence in Christ Jesus to do those good works which God before made ready for us so that we might do them."]],
    "rom10-9": [[9, "Because, if you say with your mouth that Jesus is Lord, and have faith in your heart that God has made him come back from the dead, you will have salvation:"], [10, "For with the heart man has faith to get righteousness, and with the mouth he says that Jesus is Lord to get salvation."]],
    "john1-12": [[12, "To all those who did so take him, however, he gave the right of becoming children of God--that is, to those who had faith in his name:"]],
    "1jn5-11": [[11, "And his witness is this, that God has given us eternal life, and this life is in his Son."], [12, "He who has the Son has the life; he who has not the Son of God has not the life."], [13, "I have put these things in writing for you who have faith in the name of the Son of God, so that you may be certain that you have eternal life."]],
    "rom8-1": [[1, "For this cause those who are in Christ Jesus will not be judged as sinners."], [2, "For the law of the Spirit of life in Christ Jesus has made me free from the law of sin and death."]],
    "1jn1-9": [[9, "If we say openly that we have done wrong, he is upright and true to his word, giving us forgiveness of sins and making us clean from all evil."]],
    "rom8-38": [[38, "For I am certain that not death, or life, or angels, or rulers, or things present, or things to come, or powers,"], [39, "Or things on high, or things under the earth, or anything which is made, will be able to come between us and the love of God which is in Christ Jesus our Lord."]],
    "2cor5-17": [[17, "So if any man is in Christ, he is in a new world: the old things have come to an end; they have truly become new."]],
    "gal2-20": [[20, "I have been put to death on the cross with Christ; still I am living; no longer I, but Christ is living in me; and that life which I now am living in the flesh I am living by faith, the faith of the Son of God, who in love for me, gave himself up for me."]],
    "rom12-1": [[1, "For this reason I make request to you, brothers, by the mercies of God, that you will give your bodies as a living offering, holy, pleasing to God, which is the worship it is right for you to give him."], [2, "And let not your behaviour be like that of this world, but be changed and made new in mind, so that by experience you may have knowledge of the good and pleasing and complete purpose of God."]],
    "gal5-22": [[22, "But the fruit of the Spirit is love, joy, peace, a quiet mind, kind acts, well-doing, faith,"], [23, "Gentle behaviour, control over desires: against such there is no law."]],
    "ps119-11": [[11, "I have kept your sayings secretly in my heart, so that I might do no sin against you."]],
    "2tim3-16": [[16, "Every holy Writing which comes from God is of profit for teaching, for training, for guiding, for education in righteousness:"], [17, "So that the man of God may be complete, trained and made ready for every good work."]],
    "josh1-8": [[8, "Let this book of the law be ever on your lips and in your thoughts day and night, so that you may keep with care everything in it; then a blessing will be on all your way, and you will do well."]],
    "heb4-12": [[12, "For the word of God is living and full of power, and is sharper than any two-edged sword, cutting through and making a division even of the soul and the spirit, the bones and the muscles, and quick to see the thoughts and purposes of the heart."]],
    "john15-7": [[7, "If you are in me at all times, and my words are in you, then anything for which you make a request will be done for you."]],
    "heb4-15": [[15, "For we have not a high priest who is not able to be touched by the feelings of our feeble flesh; but we have one who has been tested in all points as we ourselves are tested, but without sin."], [16, "Then let us come near to the seat of grace without fear, so that mercy may be given to us, and we may get grace for our help in time of need."]],
    "prov3-5": [[5, "Put all your hope in God, not looking to your reason for support."], [6, "In all your ways give ear to him, and he will make straight your footsteps."]],
    "matt6-33": [[33, "But let your first care be for his kingdom and his righteousness; and all these other things will be given to you in addition."]],
    "phil4-6": [[6, "Have no cares; but in everything with prayer and praise put your requests before God."], [7, "And the peace of God, which is deeper than all knowledge, will keep your hearts and minds in Christ Jesus."]],
    "1pet5-7": [[7, "Putting all your troubles on him, for he takes care of you."]],
    "isa41-10": [[10, "Have no fear, for I am with you; do not be looking about in trouble, for I am your God; I will give you strength, yes, I will be your helper; yes, my true right hand will be your support."]],
    "josh1-9": [[9, "Have I not given you your orders? Take heart and be strong; have no fear and do not be troubled; for the Lord your God is with you wherever you go,"]],
    "isa40-31": [[31, "But those who are waiting for the Lord will have new strength; they will get wings like eagles: running, they will not be tired, and walking, they will have no weariness."]],
    "ps23": [[1, "The Lord takes care of me as his sheep; I will not be without any good thing."], [2, "He makes a resting-place for me in the green fields: he is my guide by the quiet waters."], [3, "He gives new life to my soul: he is my guide in the ways of righteousness because of his name."], [4, "Yes, though I go through the valley of deep shade, I will have no fear of evil; for you are with me, your rod and your support are my comfort."], [5, "You make ready a table for me in front of my haters: you put oil on my head; my cup is overflowing."], [6, "Truly, blessing and mercy will be with me all the days of my life; and I will have a place in the house of the Lord all my days."]],
    "rom8-28": [[28, "And we are conscious that all things are working together for good to those who have love for God, and have been marked out by his purpose."]],
    "phil4-13": [[13, "I am able to do all things through him who gives me strength."]],
    "1cor10-13": [[13, "You have been put to no test but such as is common to man: and God is true, who will not let any test come on you which you are not able to undergo; but he will make with the test a way out of it, so that you may be able to go through it."]],
    "eph6-10": [[10, "Lastly, be strong in the Lord, and in the strength of his power."], [11, "Take up God's instruments of war, so that you may be able to keep your position against all the deceits of the Evil One."], [12, "For our fight is not against flesh and blood, but against authorities and powers, against the world-rulers of this dark night, against the spirits of evil in the heavens."], [13, "For this reason take up all the arms of God, so that you may be able to be strong in the evil day, and, having done all, to keep your place."], [14, "Take your place, then, having your body clothed with the true word, and having put on the breastplate of righteousness;"], [15, "Be ready with the good news of peace as shoes on your feet;"], [16, "And most of all, using faith as a cover to keep off all the flaming arrows of the Evil One."], [17, "And take salvation for your head-dress and the sword of the Spirit, which is the word of God:"], [18, "With prayers and deep desires, making requests at all times in the Spirit, and keeping watch, with strong purpose, in prayer for all the saints,"]],
    "col3-16": [[16, "Let the word of Christ be in you in all wealth of wisdom; teaching and helping one another with songs of praise and holy words, making melody to God with grace in your hearts."], [17, "And whatever you do, in word or in act, do all in the name of the Lord Jesus, giving praise to God the Father through him."]],
    "1jn4-7": [[7, "My loved ones, let us have love for one another: because love is of God, and everyone who has love is a child of God and has knowledge of God."], [8, "He who has no love has no knowledge of God, because God is love."], [9, "And the love of God was made clear to us when he sent his only Son into the world so that we might have life through him."], [10, "And this is love, not that we had love for God, but that he had love for us, and sent his Son to be an offering for our sins."], [11, "My loved ones, if God had such love for us, it is right for us to have love for one another."], [12, "No man has ever seen God: if we have love for one another, God is in us and his love is made complete in us:"]],
    "heb10-24": [[24, "And let us be moving one another at all times to love and good works;"], [25, "Not giving up our meetings, as is the way of some, but keeping one another strong in faith; and all the more because you see the day coming near."]],
    "matt5-16": [[16, "Even so let your light be shining before men, so that they may see your good works and give glory to your Father in heaven."]],
    "rom1-16": [[16, "For I have no feeling of shame about the good news, because it is the power of God giving salvation to everyone who has faith, to the Jew first, and then to the Greek."]],
    "1pet3-15": [[15, "But give honour to Christ in your hearts as your Lord; and be ready at any time when you are questioned about the hope which is in you, to give an answer in the fear of the Lord and without pride;"]],
    "matt28-19": [[19, "Go then, and make disciples of all the nations, giving them baptism in the name of the Father and of the Son and of the Holy Spirit:"], [20, "Teaching them to keep all the rules which I have given you: and see, I am ever with you, even to the end of the world."]]

  var EXTRA = [{"id":"x-john3-17","group":"Course verses","ref":"John 3:17–18","verses":[[17,"For God sent not his Son into the world to condemn the world; but that the world through him might be saved."],[18,"He that believeth on him is not condemned: but he that believeth not is condemned already, because he hath not believed in the name of the only begotten Son of God."]]},{"id":"x-1corinthians15-3","group":"Course verses","ref":"1 Corinthians 15:3–4","verses":[[3,"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;"],[4,"And that he was buried, and that he rose again the third day according to the scriptures:"]]},{"id":"x-1peter2-24","group":"Course verses","ref":"1 Peter 2:24","verses":[[24,"Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed."]]},{"id":"x-titus3-5","group":"Course verses","ref":"Titus 3:5–7","verses":[[5,"Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"],[6,"Which he shed on us abundantly through Jesus Christ our Saviour;"],[7,"That being justified by his grace, we should be made heirs according to the hope of eternal life."]]},{"id":"x-mark1-15","group":"Course verses","ref":"Mark 1:15","verses":[[15,"And saying, The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel."]]},{"id":"x-acts3-19","group":"Course verses","ref":"Acts 3:19","verses":[[19,"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;"]]},{"id":"x-romans10-11","group":"Course verses","ref":"Romans 10:11–13","verses":[[11,"For the scripture saith, Whosoever believeth on him shall not be ashamed."],[12,"For there is no difference between the Jew and the Greek: for the same Lord over all is rich unto all that call upon him."],[13,"For whosoever shall call upon the name of the Lord shall be saved."]]},{"id":"x-john5-24","group":"Course verses","ref":"John 5:24","verses":[[24,"Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life."]]},{"id":"x-john1-1","group":"Course verses","ref":"John 1:1–3","verses":[[1,"In the beginning was the Word, and the Word was with God, and the Word was God."],[2,"The same was in the beginning with God."],[3,"All things were made by him; and without him was not any thing made that was made."]]},{"id":"x-john1-14","group":"Course verses","ref":"John 1:14","verses":[[14,"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."]]},{"id":"x-philippians2-5","group":"Course verses","ref":"Philippians 2:5–8","verses":[[5,"Let this mind be in you, which was also in Christ Jesus:"],[6,"Who, being in the form of God, thought it not robbery to be equal with God:"],[7,"But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"],[8,"And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."]]},{"id":"x-colossians2-9","group":"Course verses","ref":"Colossians 2:9","verses":[[9,"For in him dwelleth all the fulness of the Godhead bodily."]]},{"id":"x-hebrews1-1","group":"Course verses","ref":"Hebrews 1:1–3","verses":[[1,"God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,"],[2,"Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;"],[3,"Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;"]]},{"id":"x-hebrews2-14","group":"Course verses","ref":"Hebrews 2:14–18","verses":[[14,"Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same; that through death he might destroy him that had the power of death, that is, the devil;"],[15,"And deliver them who through fear of death were all their lifetime subject to bondage."],[16,"For verily he took not on him the nature of angels; but he took on him the seed of Abraham."],[17,"Wherefore in all things it behoved him to be made like unto his brethren, that he might be a merciful and faithful high priest in things pertaining to God, to make reconciliation for the sins of the people."],[18,"For in that he himself hath suffered being tempted, he is able to succour them that are tempted."]]},{"id":"x-john14-6","group":"Course verses","ref":"John 14:6","verses":[[6,"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."]]},{"id":"x-acts4-12","group":"Course verses","ref":"Acts 4:12","verses":[[12,"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."]]},{"id":"x-1corinthians15-17","group":"Course verses","ref":"1 Corinthians 15:17–20","verses":[[17,"And if Christ be not raised, your faith is vain; ye are yet in your sins."],[18,"Then they also which are fallen asleep in Christ are perished."],[19,"If in this life only we have hope in Christ, we are of all men most miserable."],[20,"But now is Christ risen from the dead, and become the firstfruits of them that slept."]]},{"id":"x-romans6-9","group":"Course verses","ref":"Romans 6:9","verses":[[9,"Knowing that Christ being raised from the dead dieth no more; death hath no more dominion over him."]]},{"id":"x-hebrews7-25","group":"Course verses","ref":"Hebrews 7:25","verses":[[25,"Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them."]]},{"id":"x-exodus34-6","group":"Course verses","ref":"Exodus 34:6–7","verses":[[6,"And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth,"],[7,"Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation."]]},{"id":"x-psalm145-8","group":"Course verses","ref":"Psalm 145:8–9","verses":[[8,"The LORD is gracious, and full of compassion; slow to anger, and of great mercy."],[9,"The LORD is good to all: and his tender mercies are over all his works."]]},{"id":"x-isaiah6-3","group":"Course verses","ref":"Isaiah 6:3","verses":[[3,"And one cried unto another, and said, Holy, holy, holy, is the LORD of hosts: the whole earth is full of his glory."]]},{"id":"x-1peter1-15","group":"Course verses","ref":"1 Peter 1:15–16","verses":[[15,"But as he which hath called you is holy, so be ye holy in all manner of conversation;"],[16,"Because it is written, Be ye holy; for I am holy."]]},{"id":"x-lamentations3-22","group":"Course verses","ref":"Lamentations 3:22–23","verses":[[22,"It is of the LORD’s mercies that we are not consumed, because his compassions fail not."],[23,"They are new every morning: great is thy faithfulness."]]},{"id":"x-1corinthians1-9","group":"Course verses","ref":"1 Corinthians 1:9","verses":[[9,"God is faithful, by whom ye were called unto the fellowship of his Son Jesus Christ our Lord."]]},{"id":"x-psalm115-3","group":"Course verses","ref":"Psalm 115:3","verses":[[3,"But our God is in the heavens: he hath done whatsoever he hath pleased."]]},{"id":"x-daniel4-35","group":"Course verses","ref":"Daniel 4:35","verses":[[35,"And all the inhabitants of the earth are reputed as nothing: and he doeth according to his will in the army of heaven, and among the inhabitants of the earth: and none can stay his hand, or say unto him, What doest thou?"]]},{"id":"x-2corinthians13-14","group":"Course verses","ref":"2 Corinthians 13:14","verses":[[14,"The grace of the Lord Jesus Christ, and the love of God, and the communion of the Holy Ghost, be with you all. Amen."]]},{"id":"x-john17-3","group":"Course verses","ref":"John 17:3","verses":[[3,"And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent."]]},{"id":"x-jeremiah9-23","group":"Course verses","ref":"Jeremiah 9:23–24","verses":[[23,"Thus saith the LORD, Let not the wise man glory in his wisdom, neither let the mighty man glory in his might, let not the rich man glory in his riches:"],[24,"But let him that glorieth glory in this, that he understandeth and knoweth me, that I am the LORD which exercise lovingkindness, judgment, and righteousness, in the earth: for in these things I delight, saith the LORD."]]},{"id":"x-psalm119-105","group":"Course verses","ref":"Psalm 119:105","verses":[[105,"Thy word is a lamp unto my feet, and a light unto my path."]]},{"id":"x-psalm1-1","group":"Course verses","ref":"Psalm 1:1–3","verses":[[1,"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful."],[2,"But his delight is in the law of the LORD; and in his law doth he meditate day and night."],[3,"And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper."]]},{"id":"x-james1-22","group":"Course verses","ref":"James 1:22–25","verses":[[22,"But be ye doers of the word, and not hearers only, deceiving your own selves."],[23,"For if any be a hearer of the word, and not a doer, he is like unto a man beholding his natural face in a glass:"],[24,"For he beholdeth himself, and goeth his way, and straightway forgetteth what manner of man he was."],[25,"But whoso looketh into the perfect law of liberty, and continueth therein, he being not a forgetful hearer, but a doer of the work, this man shall be blessed in his deed."]]},{"id":"x-1peter2-2","group":"Course verses","ref":"1 Peter 2:2","verses":[[2,"As newborn babes, desire the sincere milk of the word, that ye may grow thereby:"]]},{"id":"x-acts17-11","group":"Course verses","ref":"Acts 17:11","verses":[[11,"These were more noble than those in Thessalonica, in that they received the word with all readiness of mind, and searched the scriptures daily, whether those things were so."]]},{"id":"x-hebrews4-14","group":"Course verses","ref":"Hebrews 4:14","verses":[[14,"Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession."]]},{"id":"x-matthew6-9","group":"Course verses","ref":"Matthew 6:9–13","verses":[[9,"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name."],[10,"Thy kingdom come. Thy will be done in earth, as it is in heaven."],[11,"Give us this day our daily bread."],[12,"And forgive us our debts, as we forgive our debtors."],[13,"And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen."]]},{"id":"x-mark11-22","group":"Course verses","ref":"Mark 11:22–24","verses":[[22,"And Jesus answering saith unto them, Have faith in God."],[23,"For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith."],[24,"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them."]]},{"id":"x-james1-5","group":"Course verses","ref":"James 1:5–8","verses":[[5,"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."],[6,"But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed."],[7,"For let not that man think that he shall receive any thing of the Lord."],[8,"A double minded man is unstable in all his ways."]]},{"id":"x-1thessalonians5-16","group":"Course verses","ref":"1 Thessalonians 5:16–18","verses":[[16,"Rejoice evermore."],[17,"Pray without ceasing."],[18,"In every thing give thanks: for this is the will of God in Christ Jesus concerning you."]]},{"id":"x-colossians4-2","group":"Course verses","ref":"Colossians 4:2","verses":[[2,"Continue in prayer, and watch in the same with thanksgiving;"]]},{"id":"x-1john5-14","group":"Course verses","ref":"1 John 5:14–15","verses":[[14,"And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:"],[15,"And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him."]]},{"id":"x-1john1-3","group":"Course verses","ref":"1 John 1:3–7","verses":[[3,"That which we have seen and heard declare we unto you, that ye also may have fellowship with us: and truly our fellowship is with the Father, and with his Son Jesus Christ."],[4,"And these things write we unto you, that your joy may be full."],[5,"This then is the message which we have heard of him, and declare unto you, that God is light, and in him is no darkness at all."],[6,"If we say that we have fellowship with him, and walk in darkness, we lie, and do not the truth:"],[7,"But if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus Christ his Son cleanseth us from all sin."]]},{"id":"x-psalm50-15","group":"Course verses","ref":"Psalm 50:15","verses":[[15,"And call upon me in the day of trouble: I will deliver thee, and thou shalt glorify me."]]},{"id":"x-james5-13","group":"Course verses","ref":"James 5:13–16","verses":[[13,"Is any among you afflicted? let him pray. Is any merry? let him sing psalms."],[14,"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:"],[15,"And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him."],[16,"Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much."]]},{"id":"x-john14-16","group":"Course verses","ref":"John 14:16–17","verses":[[16,"And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever;"],[17,"Even the Spirit of truth; whom the world cannot receive, because it seeth him not, neither knoweth him: but ye know him; for he dwelleth with you, and shall be in you."]]},{"id":"x-acts1-8","group":"Course verses","ref":"Acts 1:8","verses":[[8,"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judæa, and in Samaria, and unto the uttermost part of the earth."]]},{"id":"x-1corinthians3-16","group":"Course verses","ref":"1 Corinthians 3:16","verses":[[16,"Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you?"]]},{"id":"x-romans8-9","group":"Course verses","ref":"Romans 8:9–11","verses":[[9,"But ye are not in the flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any man have not the Spirit of Christ, he is none of his."],[10,"And if Christ be in you, the body is dead because of sin; but the Spirit is life because of righteousness."],[11,"But if the Spirit of him that raised up Jesus from the dead dwell in you, he that raised up Christ from the dead shall also quicken your mortal bodies by his Spirit that dwelleth in you."]]},{"id":"x-john16-13","group":"Course verses","ref":"John 16:13–15","verses":[[13,"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come."],[14,"He shall glorify me: for he shall receive of mine, and shall shew it unto you."],[15,"All things that the Father hath are mine: therefore said I, that he shall take of mine, and shall shew it unto you."]]},{"id":"x-galatians5-16","group":"Course verses","ref":"Galatians 5:16–18","verses":[[16,"This I say then, Walk in the Spirit, and ye shall not fulfil the lust of the flesh."],[17,"For the flesh lusteth against the Spirit, and the Spirit against the flesh: and these are contrary the one to the other: so that ye cannot do the things that ye would."],[18,"But if ye be led of the Spirit, ye are not under the law."]]},{"id":"x-1corinthians12-4","group":"Course verses","ref":"1 Corinthians 12:4–11","verses":[[4,"Now there are diversities of gifts, but the same Spirit."],[5,"And there are differences of administrations, but the same Lord."],[6,"And there are diversities of operations, but it is the same God which worketh all in all."],[7,"But the manifestation of the Spirit is given to every man to profit withal."],[8,"For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;"],[9,"To another faith by the same Spirit; to another the gifts of healing by the same Spirit;"],[10,"To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues:"],[11,"But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will."]]},{"id":"x-ephesians5-18","group":"Course verses","ref":"Ephesians 5:18–21","verses":[[18,"And be not drunk with wine, wherein is excess; but be filled with the Spirit;"],[19,"Speaking to yourselves in psalms and hymns and spiritual songs, singing and making melody in your heart to the Lord;"],[20,"Giving thanks always for all things unto God and the Father in the name of our Lord Jesus Christ;"],[21,"Submitting yourselves one to another in the fear of God."]]},{"id":"x-romans8-26","group":"Course verses","ref":"Romans 8:26–27","verses":[[26,"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered."],[27,"And he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God."]]},{"id":"x-hebrews11-1","group":"Course verses","ref":"Hebrews 11:1–6","verses":[[1,"Now faith is the substance of things hoped for, the evidence of things not seen."],[2,"For by it the elders obtained a good report."],[3,"Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear."],[4,"By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh."],[5,"By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God."],[6,"But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him."]]},{"id":"x-romans1-17","group":"Course verses","ref":"Romans 1:17","verses":[[17,"For therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith."]]},{"id":"x-2corinthians5-7","group":"Course verses","ref":"2 Corinthians 5:7","verses":[[7,"(For we walk by faith, not by sight:)"]]},{"id":"x-psalm37-3","group":"Course verses","ref":"Psalm 37:3–7","verses":[[3,"Trust in the LORD, and do good; so shalt thou dwell in the land, and verily thou shalt be fed."],[4,"Delight thyself also in the LORD; and he shall give thee the desires of thine heart."],[5,"Commit thy way unto the LORD; trust also in him; and he shall bring it to pass."],[6,"And he shall bring forth thy righteousness as the light, and thy judgment as the noonday."],[7,"Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass."]]},{"id":"x-philippians4-19","group":"Course verses","ref":"Philippians 4:19","verses":[[19,"But my God shall supply all your need according to his riches in glory by Christ Jesus."]]},{"id":"x-matthew6-25","group":"Course verses","ref":"Matthew 6:25–32","verses":[[25,"Therefore I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than meat, and the body than raiment?"],[26,"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?"],[27,"Which of you by taking thought can add one cubit unto his stature?"],[28,"And why take ye thought for raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:"],[29,"And yet I say unto you, That even Solomon in all his glory was not arrayed like one of these."],[30,"Wherefore, if God so clothe the grass of the field, which to day is, and to morrow is cast into the oven, shall he not much more clothe you, O ye of little faith?"],[31,"Therefore take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?"],[32,"(For after all these things do the Gentiles seek:) for your heavenly Father knoweth that ye have need of all these things."]]},{"id":"x-matthew6-34","group":"Course verses","ref":"Matthew 6:34","verses":[[34,"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof."]]},{"id":"x-matthew14-14","group":"Course verses","ref":"Matthew 14:14","verses":[[14,"And Jesus went forth, and saw a great multitude, and was moved with compassion toward them, and he healed their sick."]]},{"id":"x-matthew8-16","group":"Course verses","ref":"Matthew 8:16–17","verses":[[16,"When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with his word, and healed all that were sick:"],[17,"That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses."]]},{"id":"x-1timothy6-6","group":"Course verses","ref":"1 Timothy 6:6–10","verses":[[6,"But godliness with contentment is great gain."],[7,"For we brought nothing into this world, and it is certain we can carry nothing out."],[8,"And having food and raiment let us be therewith content."],[9,"But they that will be rich fall into temptation and a snare, and into many foolish and hurtful lusts, which drown men in destruction and perdition."],[10,"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced themselves through with many sorrows."]]},{"id":"x-philippians4-11","group":"Course verses","ref":"Philippians 4:11–12","verses":[[11,"Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content."],[12,"I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need."]]},{"id":"x-james1-2","group":"Course verses","ref":"James 1:2–4","verses":[[2,"My brethren, count it all joy when ye fall into divers temptations;"],[3,"Knowing this, that the trying of your faith worketh patience."],[4,"But let patience have her perfect work, that ye may be perfect and entire, wanting nothing."]]},{"id":"x-romans5-3","group":"Course verses","ref":"Romans 5:3–5","verses":[[3,"And not only so, but we glory in tribulations also: knowing that tribulation worketh patience;"],[4,"And patience, experience; and experience, hope:"],[5,"And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us."]]},{"id":"x-romans5-1","group":"Course verses","ref":"Romans 5:1","verses":[[1,"Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:"]]},{"id":"x-2corinthians5-21","group":"Course verses","ref":"2 Corinthians 5:21","verses":[[21,"For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him."]]},{"id":"x-romans6-6","group":"Course verses","ref":"Romans 6:6–8","verses":[[6,"Knowing this, that our old man is crucified with him, that the body of sin might be destroyed, that henceforth we should not serve sin."],[7,"For he that is dead is freed from sin."],[8,"Now if we be dead with Christ, we believe that we shall also live with him:"]]},{"id":"x-romans6-10","group":"Course verses","ref":"Romans 6:10–14","verses":[[10,"For in that he died, he died unto sin once: but in that he liveth, he liveth unto God."],[11,"Likewise reckon ye also yourselves to be dead indeed unto sin, but alive unto God through Jesus Christ our Lord."],[12,"Let not sin therefore reign in your mortal body, that ye should obey it in the lusts thereof."],[13,"Neither yield ye your members as instruments of unrighteousness unto sin: but yield yourselves unto God, as those that are alive from the dead, and your members as instruments of righteousness unto God."],[14,"For sin shall not have dominion over you: for ye are not under the law, but under grace."]]},{"id":"x-james1-12","group":"Course verses","ref":"James 1:12–15","verses":[[12,"Blessed is the man that endureth temptation: for when he is tried, he shall receive the crown of life, which the Lord hath promised to them that love him."],[13,"Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man:"],[14,"But every man is tempted, when he is drawn away of his own lust, and enticed."],[15,"Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death."]]},{"id":"x-ephesians4-31","group":"Course verses","ref":"Ephesians 4:31–32","verses":[[31,"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:"],[32,"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."]]},{"id":"x-colossians3-12","group":"Course verses","ref":"Colossians 3:12–14","verses":[[12,"Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;"],[13,"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye."],[14,"And above all these things put on charity, which is the bond of perfectness."]]},{"id":"x-2peter1-5","group":"Course verses","ref":"2 Peter 1:5–8","verses":[[5,"And beside this, giving all diligence, add to your faith virtue; and to virtue knowledge;"],[6,"And to knowledge temperance; and to temperance patience; and to patience godliness;"],[7,"And to godliness brotherly kindness; and to brotherly kindness charity."],[8,"For if these things be in you, and abound, they make you that ye shall neither be barren nor unfruitful in the knowledge of our Lord Jesus Christ."]]},{"id":"x-philippians2-12","group":"Course verses","ref":"Philippians 2:12–13","verses":[[12,"Wherefore, my beloved, as ye have always obeyed, not as in my presence only, but now much more in my absence, work out your own salvation with fear and trembling."],[13,"For it is God which worketh in you both to will and to do of his good pleasure."]]},{"id":"x-1corinthians12-12","group":"Course verses","ref":"1 Corinthians 12:12–27","verses":[[12,"For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ."],[13,"For by one Spirit are we all baptized into one body, whether we be Jews or Gentiles, whether we be bond or free; and have been all made to drink into one Spirit."],[14,"For the body is not one member, but many."],[15,"If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body?"],[16,"And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body?"],[17,"If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling?"],[18,"But now hath God set the members every one of them in the body, as it hath pleased him."],[19,"And if they were all one member, where were the body?"],[20,"But now are they many members, yet but one body."],[21,"And the eye cannot say unto the hand, I have no need of thee: nor again the head to the feet, I have no need of you."],[22,"Nay, much more those members of the body, which seem to be more feeble, are necessary:"],[23,"And those members of the body, which we think to be less honourable, upon these we bestow more abundant honour; and our uncomely parts have more abundant comeliness."],[24,"For our comely parts have no need: but God hath tempered the body together, having given more abundant honour to that part which lacked:"],[25,"That there should be no schism in the body; but that the members should have the same care one for another."],[26,"And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it."],[27,"Now ye are the body of Christ, and members in particular."]]},{"id":"x-acts2-42","group":"Course verses","ref":"Acts 2:42–47","verses":[[42,"And they continued stedfastly in the apostles’ doctrine and fellowship, and in breaking of bread, and in prayers."],[43,"And fear came upon every soul: and many wonders and signs were done by the apostles."],[44,"And all that believed were together, and had all things common;"],[45,"And sold their possessions and goods, and parted them to all men, as every man had need."],[46,"And they, continuing daily with one accord in the temple, and breaking bread from house to house, did eat their meat with gladness and singleness of heart,"],[47,"Praising God, and having favour with all the people. And the Lord added to the church daily such as should be saved."]]},{"id":"x-john13-34","group":"Course verses","ref":"John 13:34–35","verses":[[34,"A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another."],[35,"By this shall all men know that ye are my disciples, if ye have love one to another."]]},{"id":"x-galatians5-13","group":"Course verses","ref":"Galatians 5:13","verses":[[13,"For, brethren, ye have been called unto liberty; only use not liberty for an occasion to the flesh, but by love serve one another."]]},{"id":"x-1peter4-10","group":"Course verses","ref":"1 Peter 4:10","verses":[[10,"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God."]]},{"id":"x-ephesians4-1","group":"Course verses","ref":"Ephesians 4:1–6","verses":[[1,"I therefore, the prisoner of the Lord, beseech you that ye walk worthy of the vocation wherewith ye are called,"],[2,"With all lowliness and meekness, with longsuffering, forbearing one another in love;"],[3,"Endeavouring to keep the unity of the Spirit in the bond of peace."],[4,"There is one body, and one Spirit, even as ye are called in one hope of your calling;"],[5,"One Lord, one faith, one baptism,"],[6,"One God and Father of all, who is above all, and through all, and in you all."]]},{"id":"x-colossians3-15","group":"Course verses","ref":"Colossians 3:15","verses":[[15,"And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful."]]},{"id":"x-matthew18-15","group":"Course verses","ref":"Matthew 18:15–17","verses":[[15,"Moreover if thy brother shall trespass against thee, go and tell him his fault between thee and him alone: if he shall hear thee, thou hast gained thy brother."],[16,"But if he will not hear thee, then take with thee one or two more, that in the mouth of two or three witnesses every word may be established."],[17,"And if he shall neglect to hear them, tell it unto the church: but if he neglect to hear the church, let him be unto thee as an heathen man and a publican."]]},{"id":"x-ephesians4-11","group":"Course verses","ref":"Ephesians 4:11–16","verses":[[11,"And he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers;"],[12,"For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:"],[13,"Till we all come in the unity of the faith, and of the knowledge of the Son of God, unto a perfect man, unto the measure of the stature of the fulness of Christ:"],[14,"That we henceforth be no more children, tossed to and fro, and carried about with every wind of doctrine, by the sleight of men, and cunning craftiness, whereby they lie in wait to deceive;"],[15,"But speaking the truth in love, may grow up into him in all things, which is the head, even Christ:"],[16,"From whom the whole body fitly joined together and compacted by that which every joint supplieth, according to the effectual working in the measure of every part, maketh increase of the body unto the edifying of itself in love."]]},{"id":"x-james4-7","group":"Course verses","ref":"James 4:7–8","verses":[[7,"Submit yourselves therefore to God. Resist the devil, and he will flee from you."],[8,"Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded."]]},{"id":"x-1peter5-8","group":"Course verses","ref":"1 Peter 5:8–9","verses":[[8,"Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:"],[9,"Whom resist stedfast in the faith, knowing that the same afflictions are accomplished in your brethren that are in the world."]]},{"id":"x-colossians2-13","group":"Course verses","ref":"Colossians 2:13–15","verses":[[13,"And you, being dead in your sins and the uncircumcision of your flesh, hath he quickened together with him, having forgiven you all trespasses;"],[14,"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;"],[15,"And having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it."]]},{"id":"x-luke10-17","group":"Course verses","ref":"Luke 10:17–20","verses":[[17,"And the seventy returned again with joy, saying, Lord, even the devils are subject unto us through thy name."],[18,"And he said unto them, I beheld Satan as lightning fall from heaven."],[19,"Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you."],[20,"Notwithstanding in this rejoice not, that the spirits are subject unto you; but rather rejoice, because your names are written in heaven."]]},{"id":"x-romans8-37","group":"Course verses","ref":"Romans 8:37","verses":[[37,"Nay, in all these things we are more than conquerors through him that loved us."]]},{"id":"x-1john5-4","group":"Course verses","ref":"1 John 5:4–5","verses":[[4,"For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith."],[5,"Who is he that overcometh the world, but he that believeth that Jesus is the Son of God?"]]},{"id":"x-2corinthians10-3","group":"Course verses","ref":"2 Corinthians 10:3–5","verses":[[3,"For though we walk in the flesh, we do not war after the flesh:"],[4,"(For the weapons of our warfare are not carnal, but mighty through God to the pulling down of strong holds;)"],[5,"Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;"]]},{"id":"x-1john4-1","group":"Course verses","ref":"1 John 4:1–4","verses":[[1,"Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world."],[2,"Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God:"],[3,"And every spirit that confesseth not that Jesus Christ is come in the flesh is not of God: and this is that spirit of antichrist, whereof ye have heard that it should come; and even now already is it in the world."],[4,"Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world."]]},{"id":"x-matthew5-13","group":"Course verses","ref":"Matthew 5:13–15","verses":[[13,"Ye are the salt of the earth: but if the salt have lost his savour, wherewith shall it be salted? it is thenceforth good for nothing, but to be cast out, and to be trodden under foot of men."],[14,"Ye are the light of the world. A city that is set on an hill cannot be hid."],[15,"Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house."]]},{"id":"x-1corinthians13-1","group":"Course verses","ref":"1 Corinthians 13:1–7","verses":[[1,"Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal."],[2,"And though I have the gift of prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing."],[3,"And though I bestow all my goods to feed the poor, and though I give my body to be burned, and have not charity, it profiteth me nothing."],[4,"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,"],[5,"Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;"],[6,"Rejoiceth not in iniquity, but rejoiceth in the truth;"],[7,"Beareth all things, believeth all things, hopeth all things, endureth all things."]]},{"id":"x-proverbs10-9","group":"Course verses","ref":"Proverbs 10:9","verses":[[9,"He that walketh uprightly walketh surely: but he that perverteth his ways shall be known."]]},{"id":"x-titus2-7","group":"Course verses","ref":"Titus 2:7–8","verses":[[7,"In all things shewing thyself a pattern of good works: in doctrine shewing uncorruptness, gravity, sincerity,"],[8,"Sound speech, that cannot be condemned; that he that is of the contrary part may be ashamed, having no evil thing to say of you."]]},{"id":"x-colossians3-23","group":"Course verses","ref":"Colossians 3:23–24","verses":[[23,"And whatsoever ye do, do it heartily, as to the Lord, and not unto men;"],[24,"Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."]]},{"id":"x-luke16-10","group":"Course verses","ref":"Luke 16:10–12","verses":[[10,"He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much."],[11,"If therefore ye have not been faithful in the unrighteous mammon, who will commit to your trust the true riches?"],[12,"And if ye have not been faithful in that which is another man’s, who shall give you that which is your own?"]]},{"id":"x-2corinthians9-6","group":"Course verses","ref":"2 Corinthians 9:6–8","verses":[[6,"But this I say, He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully."],[7,"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver."],[8,"And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:"]]},{"id":"x-ephesians4-29","group":"Course verses","ref":"Ephesians 4:29","verses":[[29,"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers."]]},{"id":"x-james1-19","group":"Course verses","ref":"James 1:19","verses":[[19,"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:"]]},{"id":"x-romans12-17","group":"Course verses","ref":"Romans 12:17–21","verses":[[17,"Recompense to no man evil for evil. Provide things honest in the sight of all men."],[18,"If it be possible, as much as lieth in you, live peaceably with all men."],[19,"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."],[20,"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."],[21,"Be not overcome of evil, but overcome evil with good."]]},{"id":"x-philippians1-9","group":"Course verses","ref":"Philippians 1:9–11","verses":[[9,"And this I pray, that your love may abound yet more and more in knowledge and in all judgment;"],[10,"That ye may approve things that are excellent; that ye may be sincere and without offence till the day of Christ;"],[11,"Being filled with the fruits of righteousness, which are by Jesus Christ, unto the glory and praise of God."]]},{"id":"x-matthew28-18","group":"Course verses","ref":"Matthew 28:18","verses":[[18,"And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth."]]},{"id":"x-1peter3-16","group":"Course verses","ref":"1 Peter 3:16","verses":[[16,"Having a good conscience; that, whereas they speak evil of you, as of evildoers, they may be ashamed that falsely accuse your good conversation in Christ."]]},{"id":"x-2timothy2-1","group":"Course verses","ref":"2 Timothy 2:1–2","verses":[[1,"Thou therefore, my son, be strong in the grace that is in Christ Jesus."],[2,"And the things that thou hast heard of me among many witnesses, the same commit thou to faithful men, who shall be able to teach others also."]]},{"id":"x-hebrews12-1","group":"Course verses","ref":"Hebrews 12:1–3","verses":[[1,"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,"],[2,"Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God."],[3,"For consider him that endured such contradiction of sinners against himself, lest ye be wearied and faint in your minds."]]},{"id":"x-1thessalonians4-16","group":"Course verses","ref":"1 Thessalonians 4:16–18","verses":[[16,"For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first:"],[17,"Then we which are alive and remain shall be caught up together with them in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord."],[18,"Wherefore comfort one another with these words."]]},{"id":"x-1corinthians15-51","group":"Course verses","ref":"1 Corinthians 15:51–57","verses":[[51,"Behold, I shew you a mystery; We shall not all sleep, but we shall all be changed,"],[52,"In a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible, and we shall be changed."],[53,"For this corruptible must put on incorruption, and this mortal must put on immortality."],[54,"So when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall be brought to pass the saying that is written, Death is swallowed up in victory."],[55,"O death, where is thy sting? O grave, where is thy victory?"],[56,"The sting of death is sin; and the strength of sin is the law."],[57,"But thanks be to God, which giveth us the victory through our Lord Jesus Christ."]]},{"id":"x-revelation21-1","group":"Course verses","ref":"Revelation 21:1–5","verses":[[1,"And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea."],[2,"And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband."],[3,"And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God."],[4,"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."],[5,"And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful."]]},{"id":"x-colossians3-1","group":"Course verses","ref":"Colossians 3:1–4","verses":[[1,"If ye then be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God."],[2,"Set your affection on things above, not on things on the earth."],[3,"For ye are dead, and your life is hid with Christ in God."],[4,"When Christ, who is our life, shall appear, then shall ye also appear with him in glory."]]}];

at he himself hath suffered being tempted, he is able to succor them that are tempted."]],"x-john14-6":[[6,"Jesus saith unto him, I am the way, and the truth, and the life: no one cometh unto the Father, but by me."]],"x-acts4-12":[[12,"And in none other is there salvation: for neither is there any other name under heaven, that is given among men, wherein we must be saved."]],"x-1corinthians15-17":[[17,"and if Christ hath not been raised, your faith is vain; ye are yet in your sins."],[18,"Then they also that are fallen asleep in Christ have perished."],[19,"If we have only hoped in Christ in this life, we are of all men most pitiable."],[20,"But now hath Christ been raised from the dead, the firstfruits of them that are asleep."]],"x-romans6-9":[[9,"knowing that Christ being raised from the dead dieth no more; death no more hath dominion over him."]],"x-hebrews7-25":[[25,"Wherefore also he is able to save to the uttermost them that draw near unto God through him, seeing he ever liveth to make intercession for them."]],"x-exodus34-6":[[6,"And Jehovah passed by before him, and proclaimed, Jehovah, Jehovah, a God merciful and gracious, slow to anger, and abundant in lovingkindness and truth;"],[7,"keeping lovingkindness for thousands, forgiving iniquity and transgression and sin; and that will by no means clear the guilty, visiting the iniquity of the fathers upon the children, and upon the children’s children, upon the third and upon the fourth generation."]],"x-psalm145-8":[[8,"Jehovah is gracious, and merciful; Slow to anger, and of great lovingkindness."],[9,"Jehovah is good to all; And his tender mercies are over all his works."]],"x-isaiah6-3":[[3,"And one cried unto another, and said, Holy, holy, holy, is Jehovah of hosts: the whole earth is full of his glory."]],"x-1peter1-15":[[15,"but like as he who called you is holy, be ye yourselves also holy in all manner of living;"],[16,"because it is written, Ye shall be holy; for I am holy."]],"x-lamentations3-22":[[ inded man, unstable in all his ways."]],"x-1thessalonians5-16":[[16,"Rejoice always;"],[17,"pray without ceasing;"],[18,"in everything give thanks: for this is the will of God in Christ Jesus to you-ward."]],"x-colossians4-2":[[2,"Continue stedfastly in prayer, watching therein with thanksgiving;"]],"x-1john5-14":[[14,"And this is the boldness which we have toward him, that, if we ask anything according to his will, he heareth us:"],[15,"and if we know that he heareth us whatsoever we ask, we know that we have the petitions which we have asked of him."]],"x-1john1-3":[[3,"that which we have seen and heard declare we unto you also, that ye also may have fellowship with us: yea, and our fellowship is with the Father, and with his Son Jesus Christ:"],[4,"and these things we write, that our joy may be made full."],[5,"And this is the message which we have heard from him and announce unto you, that God is light, and in him is no darkness at all."],[6,"If we say that we have fellowship with him and walk in the darkness, we lie, and do not the truth:"],[7,"but if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus his Son cleanseth us from all sin."]],"x-psalm50-15":[[15,"And call upon me in the day of trouble: I will deliver thee, and thou shalt glorify me."]],"x-james5-13":[[13,"Is any among you suffering? let him pray. Is any cheerful? let him sing praise."],[14,"Is any among you sick? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:"],[15,"and the prayer of faith shall save him that is sick, and the Lord shall raise him up; and if he have committed sins, it shall be forgiven him."],[16,"Confess therefore your sins one to another, and pray one for another, that ye may be healed. The supplication of a righteous man availeth much in its working."]],"x-john14-16":[[16,"And I will pray the Father, and he shall give you another Comforter, that he may be with you for ever,"],[17,"even the Spirit of truth: whom the world cannot receive; for it beholdeth him not, neither knoweth him: ye know him; for he abideth with you, and shall be in you."]],"x-acts1-8":[[8,"But ye shall receive power, when the Holy Spirit is come upon you: and ye shall be my witnesses both in Jerusalem, and in all Judæa and Samaria, and unto the uttermost part of the earth."]],"x-1corinthians3-16":[[16,"Know ye not that ye are a temple of God, and that the Spirit of God dwelleth in you?"]],"x-romans8-9":[[9,"But ye are not in the flesh but in the Spirit, if so be that the Spirit of God dwelleth in you. But if any man hath not the Spirit of Christ, he is none of his."],[10,"And if Christ is in you, the body is dead because of sin; but the spirit is life because of righteousness."],[11,"But if the Spirit of him that raised up Jesus from the dead dwelleth in you, he that raised up Christ Jesus from the dead shall give life also to your mortal bodies through his Spirit that dwelleth in you."]],"x-john16-13":[[13,"Howbeit when he, the Spirit of truth, is come, he shall guide you into all the truth: for he shall not speak from himself; but what things soever he shall hear, these shall he speak: and he shall declare unto you the things that are to come."],[14,"He shall glorify me: for he shall take of mine, and shall declare it unto you."],[15,"All things whatsoever the Father hath are mine: therefore said I, that he taketh of mine, and shall declare it unto you."]],"x-galatians5-16":[[16,"But I say, Walk by the Spirit, and ye shall not fulfil the lust of the flesh."],[17,"For the flesh lusteth against the Spirit, and the Spirit against the flesh; for these are contrary the one to the other; that ye may not do the things that ye would."],[18,"But if ye are led by the Spirit, ye are not under the law."]],"x-1corinthians12-4":[[4,"Now there are diversities of gifts, but the same Spirit."],[5,"And there are diversities of ministrations, and the same Lord."]
