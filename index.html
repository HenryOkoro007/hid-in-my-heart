<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hid in my heart — Bible Memory Verse Trainer</title>
<meta name="description" content="Memorize Scripture with a guided 12-module course. Practice with fade, first-letter, typing and spoken recital modes. Free, works offline.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16233B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hid in my heart">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are self-hosted (SIL Open Font License, see fonts/). No requests leave this site. */
@font-face { font-family: "Newsreader"; font-style: normal; font-weight: 400 500; font-display: swap; src: url(fonts/newsreader-latin.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 400 600; font-display: swap; src: url(fonts/instrument-sans-latin.woff2) format("woff2"); }
:root {
  --bg: #EDF1F5;
  --surface: #F8FAFC;
  --ink: #16233B;
  --ink-soft: #55627A;
  --line: #CBD5E1;
  --accent: #8A5A12;
  --accent-ink: #FFFFFF;
  --good: #3F7A5C;
  --good-bg: #DDEEE5;
  --warn-bg: #F6E7C8;
  --bad: #A8432F;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1829; --surface: #172238; --ink: #E7ECF4; --ink-soft: #9AA7BE;
    --line: #2B3957; --accent: #E2AE4A; --accent-ink: #1A1305;
    --good: #7CC3A0; --good-bg: #1B3A2E; --warn-bg: #43361A; --bad: #E58A76;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1829; --surface: #172238; --ink: #E7ECF4; --ink-soft: #9AA7BE;
  --line: #2B3957; --accent: #E2AE4A; --accent-ink: #1A1305;
  --good: #7CC3A0; --good-bg: #1B3A2E; --warn-bg: #43361A; --bad: #E58A76;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.app { max-width: 1060px; margin: 0 auto; padding: 20px 16px 56px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
@media (max-width: 560px) { .brand { flex: 1 1 100%; } .brand img { width: 40px; height: 40px; border-radius: 10px; } .tools { justify-content: flex-start; } }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-soft); font-size: 0.9rem; margin: 2px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; color: var(--ink-soft); min-height: 44px; min-width: 44px; }
.size { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 0 2px; }
.size button { background: none; border: 0; border-radius: 999px; min-width: 44px; min-height: 44px; color: var(--ink-soft); font-size: 0.95rem; }
.size button:disabled { opacity: 0.4; cursor: default; }
.size output { font-size: 0.8rem; color: var(--ink-soft); min-width: 3.2em; text-align: center; }
.sr:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.update { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 12px 14px; z-index: 10; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.update[hidden] { display: none; }
.update .btn.primary { border-color: var(--surface); }
/* Comfortable tap targets (44px) for every control. */
.view-btn, .mode, .chip, .btn, .opt, .favbtn, .refbtn, .p-btn, .mrow { min-height: 44px; }
.links a, .foot a { display: inline-block; padding: 12px 4px; min-width: 44px; text-align: center; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
/* Hidden and first-letter words are small; extend their tap area without changing the line layout. */
.w::after { content: ""; position: absolute; left: -0.12em; right: -0.12em; top: -0.45em; bottom: -0.45em; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.views { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
@media (max-width: 520px) { .view-btn { padding: 7px 12px !important; font-size: 0.88rem !important; } }
.view-btn .vb-n { opacity: 0.75; font-weight: 400; }
.layout.solo { grid-template-columns: 1fr !important; }
.layout.solo .side { display: none; }
.titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.titlerow h2 { margin-right: auto; }
.favbtn { flex: none; border: 1px solid var(--line); background: none; color: var(--ink-soft); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer; }
.favbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.favbtn .st { color: var(--accent); font-size: 1.05em; }
.fstar { color: var(--accent); margin-right: 4px; }
.empty { color: var(--ink-soft); max-width: 52ch; }
.stats-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin: 18px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.9rem; line-height: 1.1; }
.stat span { font-size: 0.82rem; color: var(--ink-soft); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 360px; margin: 10px 0 8px; }
.cal .dow { text-align: center; font-size: 0.72rem; color: var(--ink-soft); }
.cal .day { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: none; }
.cal .day.on { background: color-mix(in srgb, var(--accent) 38%, transparent); border-color: transparent; }
.cal .day.did { background: var(--accent); border-color: transparent; }
.cal .day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal .day.future { opacity: 0.35; border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--ink-soft); margin: 4px 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.legend i.on { background: color-mix(in srgb, var(--accent) 38%, transparent); border-color: transparent; }
.legend i.did { background: var(--accent); border-color: transparent; }

.view-btn { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 18px; font-size: 0.95rem; font-weight: 500; color: var(--ink-soft); }
.view-btn[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 16px; font-size: 0.9rem; color: var(--ink-soft); }
.crumb .btn { padding: 6px 12px; }
.lead { color: var(--ink-soft); max-width: 62ch; margin: 0 0 8px; }
.lvl { margin: 28px 0 6px; }
.lvl h3 { font-family: var(--serif); font-weight: 500; font-size: 1.4rem; margin: 0 0 2px; letter-spacing: -0.01em; }
.lvl p { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 8px; max-width: 62ch; }
.mrow { display: grid; gap: 4px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 4px; }
.mrow:hover .mt { text-decoration: underline; text-underline-offset: 3px; }
.mt { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
.mp { color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }
.mm { font-size: 0.8rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.sect { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; margin: 24px 0 8px; }
.refs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
.refbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 12px; font-size: 0.92rem; font-weight: 500; }
.refbtn:hover { border-color: var(--ink-soft); }
.refbtn.key { border-color: var(--accent); }
.topic { margin: 0 0 16px; }
.topic h4 { font-family: var(--serif); font-weight: 500; font-size: 1.08rem; margin: 0 0 6px; }
.caution { background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; max-width: 62ch; margin: 0 0 16px; }
.layout { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .layout { grid-template-columns: 260px 1fr; align-items: start; } }

/* passage picker */
.side { min-width: 0; }
.picker { display: grid; gap: 8px; }
.picker select { width: 100%; font: inherit; font-size: 1rem; padding: 12px 12px; border: 1px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink); }
.picker .stats { font-size: 0.85rem; color: var(--ink-soft); }
.passages { display: none; }
@media (min-width: 900px) {
  .picker { display: none; }
  .side { position: sticky; top: 16px; }
  .passages { display: block; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 6px; }
}
.grp { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; font-family: var(--serif); font-size: 1.02rem; font-weight: 500; color: var(--ink); }
.grp:first-child { margin-top: 0; }
.grp span { font-family: var(--sans); font-size: 0.78rem; color: var(--ink-soft); font-weight: 400; }
.p-btn {
  width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px;
  display: grid; gap: 3px;
}
.p-btn:hover { border-color: var(--line); }
.p-btn[aria-current="true"] { background: var(--surface); border-color: var(--ink); box-shadow: inset 4px 0 0 var(--accent); }
.p-ref { font-size: 0.97rem; font-weight: 500; }
.p-meta { font-size: 0.78rem; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 12px; height: 4px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--good); }
.due { color: var(--accent); font-weight: 600; }
.pager { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 22px; }

/* main panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px 20px; }
@media (min-width: 640px) { .panel { padding: 30px 34px 26px; } }
.panel h2 { font-family: var(--serif); font-weight: 500; font-size: 1.9rem; margin: 0 0 14px; letter-spacing: -0.01em; }

.modes { display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 14px; }
.mode { flex: 1 1 auto; background: none; border: 0; border-radius: 7px; padding: 8px 10px; font-size: 0.95rem; color: var(--ink-soft); font-weight: 500; }
.mode[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.ver-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 14px; }
.ver-row label { font-size: 0.9rem; color: var(--ink-soft); }
.ver-row select { font: inherit; font-size: 0.95rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 100%; }
.links { font-size: 0.88rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 0 0 16px; }
.links a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.editor-note { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 12px; max-width: 62ch; }
.verse-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; color: var(--ink-soft); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.hint { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 16px; max-width: 60ch; }

/* scripture text */
.scripture { font-family: var(--serif); font-size: calc(1.3rem * var(--text-scale, 1)); line-height: 1.85; max-width: 62ch; margin: 0 0 22px; }
@media (min-width: 640px) { .scripture { font-size: calc(1.45rem * var(--text-scale, 1)); } }
.scripture sup { font-family: var(--sans); font-size: 0.62em; color: var(--accent); font-weight: 600; margin-right: 3px; vertical-align: 0.5em; }
.vblock { display: block; margin-bottom: 6px; }
.w { position: relative; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; display: inline; }
.w.hide { color: transparent; border-bottom: 2px solid var(--ink-soft); user-select: none; }
.w.hide:hover { border-bottom-color: var(--accent); }
.w.show-again { color: var(--accent); }
.w.initial { letter-spacing: 0.06em; }

.controls { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin-bottom: 22px; }
.controls label { font-size: 0.92rem; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
input[type=range] { accent-color: var(--accent); width: 190px; }
.btn { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; font-size: 0.92rem; font-weight: 500; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }

textarea {
  width: 100%; min-height: 180px; resize: vertical; padding: 14px;
  font-family: var(--serif); font-size: calc(1.2rem * var(--text-scale, 1)); line-height: 1.6;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.check-label { font-size: 0.92rem; color: var(--ink-soft); display: inline-flex; gap: 8px; align-items: center; }
.hint-block { font-family: var(--serif); font-size: calc(1.1rem * var(--text-scale, 1)); line-height: 1.7; color: var(--ink-soft); background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }

.mic-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 14px; }
.mic { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 12px 22px; font-size: 1rem; font-weight: 600; }
.mic .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.mic[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.mic[aria-pressed="true"] .dot { background: #fff; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
.speak-msg { font-size: 0.9rem; color: var(--ink-soft); }
.speak-msg.err { color: var(--bad); }
.note { font-size: 0.85rem; color: var(--ink-soft); margin: 4px 0 0; max-width: 62ch; }
.result { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; }
.score { font-family: var(--serif); font-size: 2.2rem; font-weight: 500; margin: 0; }
.score small { font-family: var(--sans); font-size: 0.95rem; color: var(--ink-soft); font-weight: 400; margin-left: 8px; }
.diff { font-family: var(--serif); font-size: calc(1.25rem * var(--text-scale, 1)); line-height: 1.9; max-width: 62ch; margin: 10px 0 8px; }
.diff .ok { color: var(--ink); }
.diff .miss { background: var(--warn-bg); border-radius: 3px; padding: 0 3px; }
.diff .extra { color: var(--bad); text-decoration: line-through; }
.legend { font-size: 0.85rem; color: var(--ink-soft); }

.rate { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.rate p { margin: 0 0 10px; font-weight: 500; }
.rate .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.rate .opt { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; font-size: 0.92rem; }
.rate .opt[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--ink); }
.saved { font-size: 0.85rem; color: var(--good); margin-left: 6px; }
.foot { color: var(--ink-soft); font-size: 0.82rem; margin-top: 22px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="" width="48" height="48">
      <div>
        <h1>Hid in my heart</h1>
        <p class="sub">Bible memory verses<span id="summary"></span></p>
      </div>
    </div>
    <div class="tools">
      <div class="size" role="group" aria-label="Text size">
        <button type="button" id="sizeDown" aria-label="A− smaller text">A−</button>
        <output id="sizeOut" aria-live="polite">100%</output>
        <button type="button" id="sizeUp" aria-label="A+ larger text">A+</button>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" title="Switch between light and dark">Theme</button>
    </div>
  </header>
  <div class="views" id="views" role="tablist" aria-label="Choose a view">
    <button class="view-btn" type="button" role="tab" aria-controls="panel" data-view="course">Course</button>
    <button class="view-btn" type="button" role="tab" aria-controls="panel" data-view="passages">All passages</button>
    <button class="view-btn" type="button" role="tab" aria-controls="panel" data-view="favs">Favorites</button>
    <button class="view-btn" type="button" role="tab" aria-controls="panel" data-view="days">Consistency</button>
  </div>

  <div class="layout" id="layout">
    <div class="side">
      <div class="picker"><label class="sr" for="pSel" id="pSelLabel">Passage</label><select id="pSel"></select><div class="stats" id="statsMobile"></div></div>
      <nav class="passages" id="passages" aria-label="Passages"></nav>
    </div>
    <main class="panel" id="panel"><p class="lead">Loading…</p></main>
  </div>
</div>

<div class="update" id="updateBar" role="status" hidden><span>A new version of the app is ready.</span><button class="btn primary" type="button" id="updateBtn">Update now</button></div>
<script src="core.js"></script>
<script src="external.js"></script>
<script src="app.js"></script>
</body>
</html>
